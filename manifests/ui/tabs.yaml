schemaVersion: "1.0"
kind: "RainUiManifest"
id: "ui-tabs"
name: "Tabs"
category: "ui"
assetIdentity: "registry-candidate"
maturity: "registry-candidate"
modificationMode: "managed"
sourcePath: "packages/ui/src/tabs/tabs.tsx"
styleSourcePath: "packages/ui/src/tabs/tabs.styles.ts"
sourceVersion: "local-2026-09-12"
publication: "unpublished"
description: "Complete content-section navigation and panels with one accepted value, contiguous More overflow and page-session content retention."
useWhen:
  - "Switch related content sections within one page. Use the complete Tabs recipe by default."
doNotUseWhen:
  - "Independent page navigation, closable workspaces, dragging or creating tabs; use links or a separately designed workspace pattern."
anatomy:
  - "Root"
  - "Nav"
  - "List"
  - "Tab with Paint, Icon, Label, Count and optional Indicator"
  - "More and radio-menu items"
  - "DisabledDescription"
  - "Panels and Panel shells"
parts:
  - "root"
  - "nav"
  - "list"
  - "tab"
  - "icon"
  - "label"
  - "count"
  - "indicator"
  - "extra-start"
  - "extra-end"
  - "more"
  - "panel"
slots:
  - "item.content and optional leadingIcon; extraStart and extraEnd are independent operations."
props:
  - "items: unique finite number or nonempty string value, nonempty label, content. Numeric and string identities remain distinct."
  - "value / defaultValue / onValueChange: accepted identity or null; controlled mode requires a callback and cannot change during the instance lifetime."
  - "change reasons: tab, more, initial, disabled, missing; details.previousValue is the previously accepted value."
  - "item.count / countAccessibleLabel: zero is retained; custom abbreviations require a complete description."
  - "item.disabled / disabledReason: disabled selection can be controlled for read-only backfill."
  - "appearance / size / position / activationMode / panelMount"
  - "overflow and align for horizontal; itemAlign for vertical; indicatorSize and showDivider only for line."
  - "indicatorSize: content (default) caps length at 24/28/32px for sizes 28/32/38; stretch preserves the original sizing. showDivider defaults to false."
  - "widthMode: natural (default) or equal for the actual horizontal layout; More remains a separate measured control."
  - "labelLines: 1 by default; 2 is vertical-only and requires left alignment. collapseBelow is an optional positive finite available-width threshold for vertical-to-top switching."
  - "aria-label or aria-labelledby is required; optional aria-describedby, id, className and declared localRecipe."
variants:
  - "line"
  - "contained"
  - "soft"
sizes:
  - 28
  - 32
  - 38
positions:
  - "top"
  - "bottom"
  - "start"
  - "end"
states:
  - "ordinary"
  - "hover"
  - "pressed"
  - "selected"
  - "focus"
  - "focus+hover"
  - "focus+pressed"
  - "selected+hover"
  - "selected+pressed"
  - "selected+focus"
  - "disabled"
  - "selected+disabled"
tokens:
  - "Foundations tabs-token-contract owns 28/32/38 complete recipes; compact defaults to 32 and default density to 38."
  - "Label 13/18, 14/20, 15/22 with regular 400 and selected 600; Count 12/14 regular 400; Icon 14/14/16."
  - "Two-line heights 46/52/60 preserve each size's typography; Line indicator 2/2/3 with rounded ends; contained paint H-6; soft selected fill has no persistent border; Panel gap 16."
  - "Existing Rain Text, Icon, Border, Fill and Background categories; colors are static in tabs.styles.ts."
  - "Soft ordinary/focus Label and Count have a scoped Text/Neutral/4 eligibility decision on Background/Neutral/1 only; no global weak-neutral override."
dependencies:
  - "React; @rain-next/foundations; Base UI 1.8.0 public Tabs and Tooltip."
  - "Existing DropdownMenu, PopupProvider, shared global Focus, rainCn and Rain Local Recipe."
  - "Public more-horizontal icon and caller-provided public Rain icons."
layoutConstraints:
  - "9 size/appearance recipes and 36 direction combinations; line stretch/content indicator always faces its Panel."
  - "Content indicators are centered: min(content-group width, size cap) horizontally and min(item height, size cap) vertically. Stretch retains item width minus inline padding horizontally and full item height vertically; equal-width items keep this behavior."
  - "Horizontal More displays a contiguous measured interval, prioritizes actual keyboard focus then accepted value and uses scroll only below the identifiable-target budget."
  - "Vertical navigation is 192px with 16px inline content padding. Single-line items default to center; two-line groups align left on either side. Left-aligned mixed-icon groups reserve an icon column, while all-iconless groups do not."
  - "Counts follow the label block and are centered vertically with icons. Long counts retain their actual value, accessible description and full-text Tooltip while constrained inside the column."
  - "Contained hit areas use a 2px gap and per-item 3px inset: 3px outer paint gutters and 8px between adjacent paints. Line/soft use 8px gaps."
  - "Explicit collapseBelow changes direction on the same Root using its available width; selection, panel identity and local drafts persist. The documentation's 560px threshold is a local candidate, not a global breakpoint."
  - "Extra operations remain outside More. Tall operations align with the Panel-facing edge; page layout can move operations to a separate narrow-screen row."
  - "Coarse-pointer rules reserve non-overlapping 44px effective targets without changing the visual recipe or its font."
compositionRules:
  - "Use complete Tabs first. Explicit layout changes use one synchronously present Nav and one Panels beneath the same Root. Suspense belongs inside item.content."
  - "Manual mode only moves focus with arrows; Enter or Space accepts. Automatic mode applies only actual Tab focus, never browsing More."
  - "Controlled requests do not mount content or change selected state before host acceptance; delayed acceptance cannot steal external focus."
  - "Uncontrolled invalid initial, deleted or disabled selection normalizes to the first enabled identity with one reasoned callback; explicit null remains empty."
  - "Panel shells retain stable controls/labelledby links. Default lazy-retain mounts only after actual activation, then retains until identity deletion or Root removal."
  - "Rebuilt item objects with the same business identity retain content. Per-item panelMount can override lazy-retain, eager-retain or unmount."
  - "The host owns routing, persistence, data requests, media and hidden-content effects."
allowedModifications:
  - "Existing Variant, then declared Local Recipe for named parts; Local Fork for a different structure."
restrictedModifications:
  - "Do not invent a parallel selected value, roving-focus controller, unregistered visual tokens or body-level focus restoration."
  - "Do not broaden the soft text eligibility decision, hide contrast findings, or infer visual acceptance from design mockups."
accessibility:
  - "Named tablist, unique tab/panel IDs, reciprocal associations and native disabled buttons. Hidden registered tabs preserve associations without extra interactive clones."
  - "Directional arrows, Home/End, looping, disabled skipping, manual or automatic activation; multiple and nested Roots isolate their keyboard scope."
  - "More uses menuitemradio semantics, count descriptions and disabled reasons; accepted selection reveals the original Tab. Escape returns to More, Tab/outside dismissal preserves the outside target."
  - "Truncated enabled names have keyboard/hover Tooltip and Escape dismissal; native disclosure exposes full disabled names and optional reasons in all orientations."
  - "Shared global Focus is independent of selection; forced colors retain a selected paint boundary and disabled system color."
  - "Real screen-reader and cross-browser checks remain separate from current Chromium automation."
examples:
  - "#tabs"
recipes:
  - "Complete course sections with four Label/Icon/Count combinations and independent operations."
  - "Contained and soft local panels with retained drafts."
  - "Vertical settings, long names, scroll and declared Local Recipe."
  - "Controlled delay, dynamic deletion and complete recipe checks in the documentation disclosure."
antiPatterns:
  - "Treat focused, requested or menu-browsed values as already accepted."
  - "Replace a leading prefix with a distant selected item or treat More collection as deletion."
  - "Assume retained DOM persists across navigation or stops media and network effects."
relatedComponents:
  - "DropdownMenu"
  - "Button"
  - "Input"
relatedBlocks: []

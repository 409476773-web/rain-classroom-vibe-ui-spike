publication: "unpublished"
description: "Rain learning and status display with fixed meaning and complete shape."
useWhen:
  - "展示教学任务状态：进行中、未提交或已结束；进行中可显式显示状态点。"
doNotUseWhen:
  - "需要任意工作流状态、系统成功或错误反馈，或通过点击标签推进业务状态。"
anatomy:
  - "Static native span with named label and optional display parts."
parts:
  - "root"
  - "label"
  - "status-dot"
props:
  - "status: 进行中/未提交/已结束; showDot only for 进行中."
  - "size 20/24/32; appearance filled/solid."
  - "Native span attributes and ref; className is for layout. No onClick, style, arbitrary colors or custom badge strings."
states:
  - "static; reminder or scored when relevant; no independent click, hover, selection or disabled state."
tokens:
  - "Existing Tag palette and dedicated status colors; Solid uses OnColor across text and icons."
  - "Complete tagShapeRecipes, Space/Radius/Line/Typography; score badge 10/12 with 600 weight."
  - "Neutral and ended Solid use existing Slate; source RGBA remains preserved."
compositionRules:
  - "Default to the complete recipe; fixed shape rejects inapplicable size/layout/appearance."
  - "Use a real surrounding control for navigation or interaction. Do not nest independent actions."
allowedModifications:
  - "Choose registered semantic values, complete appearance and size; native layout className."
restrictedModifications:
  - "No arbitrary profile values, raw colors, public state inference, interactive behavior or badge text customization."
accessibility:
  - "Keep visible business labels and native id/ref. Reminder meaning is text, decorative shapes are hidden."
  - "Text enlargement grows intrinsic frames; internal score layout keeps the body centered."
  - "System icons are redundant with text; reduced motion stops processing rotation."
examples:
  - "#tag"
visualLineage:
  rainClassicReferences:
    - "src/components/Tag/StatusTag.vue and tag.utils.js/tag.scss in the read-only Rain Classic repository."
    - "docs/plans/2026-09-08-tag-design.md sections 13 and 14."
  retainedTraits:
    - "Exact business mapping, dedicated shape identity, original profile colors."
  redesignedTraits:
    - "All Solid foregrounds use white; equal-font open assignment and fully internal, intrinsically balanced score layout."
  externalReferences:
    - "Existing design comparison in docs/plans/2026-09-08-tag-design.md."
  intentionallyNotInherited:
    - "Vue implementation, invalid-value assignment fallback, mixed 8px score badge typography."

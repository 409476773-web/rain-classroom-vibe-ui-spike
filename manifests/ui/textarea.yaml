publication: "unpublished"
description: "Native multiline text editing with Rain field appearance and complete FormItem linkage."
useWhen:
  - "Course descriptions, instructions and long feedback require plain multiline text."
doNotUseWhen:
  - "Rich text, automatic height, attachments or a form validation engine are required."
anatomy:
  - "Root"
  - "Control"
parts:
  - "root"
  - "control"
props:
  - "Native textarea attributes and HTMLTextAreaElement ref"
  - "value / defaultValue: string; choose controlled or native uncontrolled mode"
  - "onChange / onValueChange"
  - "rows: default 4; native maxLength uses UTF-16 code units"
  - "appearance: outlined | filled | underlined"
  - "status: default | warning | error"
  - "disabled / readOnly / required"
  - "className: root layout only"
slots: []
variants:
  - "outlined"
  - "filled"
  - "underlined"
states:
  - "editable"
  - "warning"
  - "error"
  - "read-only"
  - "disabled"
  - "focus-visible"
density: "Inherit region density; retain Reading/Small for long text in both modes."
dependencies:
  - "FormItem context"
  - "fieldFrameRecipe"
  - "Input control reset"
  - "rainCn"
tokens:
  - "Typography/Reading/Small"
  - "Space/8"
  - "Space/12"
  - "Space/40"
  - "Radius/6"
  - "shared field frame and Input control colors / Focus"
layoutConstraints:
  - "Full host width; rows controls initial height; native vertical resize with 40px control minimum; disabled cannot resize."
  - "Root has no horizontal padding; control owns 12px horizontal / 8px vertical text padding so native resize stays at the frame's inner corner."
compositionRules:
  - "FormItem owns field ID, status, label, help and feedback; IDs merge and deduplicate."
  - "Disabled and required are additive; error forces aria-invalid."
  - "Native uncontrolled state or host controlled state is the only value authority. Host owns validation and save timing."
  - "rain-input style class reuses existing forced-colors/reset rules; identity remains ui-textarea."
allowedModifications:
  - "Native rows, name, callbacks, content and host layout."
restrictedModifications:
  - "Do not hardcode colors or create a second field/form store."
accessibility:
  - "Visible FormItem label or caller accessible name required; native textarea semantics, keyboard selection and multiline Enter."
  - "Native required, disabled, readonly and FormData/reset; shared focus-visible and forced-colors styles."
  - "Shared field contrast findings remain pending; no inherited visual acceptance."
examples:
  - "#textarea"
recipes:
  - "textarea-long-text-form: local-experiment; host owns draft, validation and simulated save"
antiPatterns:
  - "Passing a bare textarea to FormItem without consuming its context"
  - "Treating Mock save as persistence"
relatedComponents:

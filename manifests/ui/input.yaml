  - "Typography/UI/Compact and Typography/UI/Default"
  - "Space/4,8,12; Radius/4,6; Line/Thickness/1; Icon/Size/14,16"
  - "Public Text/Icon/Border/Fill category colors and shared Focus"
  - "Text/Neutral/5 for placeholder, suffixText units and normal count; prefix/custom text retain Text/Neutral/4"
compositionRules:
  - "FormItem labelPosition=inside places its fixed visible label within the field; top remains the default and label identity/description ownership is unchanged."
  - "For a one-line toolbar, compose explicit size32 in default density and size28 in compact density with matching Buttons; global component defaults remain unchanged."
  - "Explicit size wins; all internal gaps are Space/4."
  - "FormItem owns labels, descriptions and validation presentation; page owns validation rules."
  - "Clear uses the standard value event path once and returns focus; it does not dismiss validation."
  - "Clear uses circle-close-filled centered at 14px inside a 24px target; its stable slot precedes suffixText units."
  - "Desktop clear shows on hover/focus and touch shows nonempty values; hidden clear never separates units from count/actions."
  - "Read-only permits selecting/copying and explicitly non-changing actions; disabled blocks every action."
  - "Read-only pointer focus has no editing ring; keyboard positioning and individual action focus remain visible."
  - "Default editing has one visible 1px blue boundary plus the light halo; do not stack two adjacent blue lines."
  - "Validation uses same-state field and internal-action focus; underlined fields retain only their bottom line. Internal nested search remains independent."
  - "Count measures graphemes using native Intl.Segmenter; supported browsers must provide it."
  - "Hard limits affect the edited portion after composition; backfilled overflow and changed limits never truncate existing values."
  - "A limit shows compact count such as 2/3 with no inserted spaces; overflow also has a non-color accessible description and does not set error status."
  - "Keep one trailing TextButton or IconButton; preserve the declared content order."
  - "Direct TextButton children default to brand when tone is omitted; explicit tones and disabled/loading behavior remain owned by Button."
allowedModifications:
  - "Choose a complete size, semantic Parts and native input attributes."
restrictedModifications:
  - "Do not bypass IME/value/disabled behavior or the shared field focus recipe."
  - "Do not use arbitrary visual values, private reference Tokens or Tailwind default visual tokens."
accessibility:
  - "Native input with associated label and descriptions."
  - "Hidden clear cannot be focused; visible clear has a 24px target and returns focus."
  - "Error is aria-invalid; caller grammar/spelling semantics remain intact."
  - "Forced colors preserve boundaries and Focus."
visualLineage:
  rainClassicReferences:
    - "Rain Classic Input: sizes 28/32/36, contextual clear, unit and action composition"
  externalReferences:
    - "https://ui.shadcn.com/docs/components/base/input-group"
    - "https://ant.design/components/input/"
    - "https://mui.com/material-ui/react-text-field/"
    - "https://react-aria.adobe.com/SearchField"
  retainedTraits:

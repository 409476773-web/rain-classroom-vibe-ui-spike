props:
  - "Table.interaction=row|cell，默认row；cell模式仅单元格hover，行选择独立由TableRow.selected表达。"
  - "TableActionCell：active/editing/invalid、identity/depth/leadingSpace、align、leading/disclosure/actions、actionCount/persistentActions/onActivate；TableActionHeader.selection/identity/leadingSpace。"
  - "TableRowActions.selection/move/add固定顺序；TableRowCheckbox继承Checkbox受控/非受控与半选，不内置选择范围。TableCellActionButton.tip为短提示，aria-label保留上下文。"
  - "TableInlineInput沿用Input API；TableDisclosureButton.expanded；TableReadonlyMark.reason；TablePersonValue.name/src、TableImageValue.images/onPreview、TableFileValue.files/onPreview/onManage、TableDataValue.value/unit/emphasized。"
  - "tableHeaderHeights导出compact/default的title/control/twoLines几何，供虚拟化及Canvas适配器计算真实布局；Table可包裹原生thead/tr/th并继承同一表头默认。"
  - "原生元素属性和 ref；TableRow.selected 只表达行视觉，选择语义由 Checkbox 提供。"
  - "TableScrollArea 必须提供 aria-label，独立于 Table，默认可键盘滚动。"
  - "TableRow.headerLayer=title|control；titleLines=1|2；TableHead.align=start|center|end，scope=colgroup默认居中。"
  - "TableHeaderContent.children/actions/align；所有actions位于文字后，使用TableHeaderAction.active/open表达生效与展开。"
  - "TableSortButton.label/direction/onDirectionChange；direction=none|ascending|descending，受控三态；宿主同步TableHead.aria-sort与数据顺序。"
  - "TableHeaderControl.label/htmlFor/kind=field|switch/align/children；field宽88px；控件使用现有24/32高度，Switch使用small。Select消费tableHeaderSelectRecipe。"
slots:
  - "children"
variants:
  - "default"
states:
  - "default"
  - "disabled"
  - "selected"
  - "sorted"
  - "filtered"
  - "open"
dependencies:
  - "react"
  - "@rain-next/foundations"
  - "tailwind-merge"
tokens:
  - "单元格模式：Fill/Neutral/Alpha/6；Fill/Brand/Alpha/4；Border/Neutral/2/3；Background/Neutral/3/4；Icon/Neutral/3；UI/Data字体分Part。"
  - "Rain UI 字体、表头13/18/400、正文14/22、Space/4/8/12/16/20/32、既有 Focus。"
  - "Background/Neutral/1/2；Text/Neutral/2/3/4；Border/Neutral/3；Fill/Neutral/Alpha/5；Fill/Brand/Alpha/4。"
  - "Icon/Neutral/3/4按70/30混合；Fill/Neutral/Alpha/3表达已打开入口。"
layoutConstraints:
  - "常规表头44px/普通正文50px；紧凑表头32px/普通正文44px；多行内容自然增高，不裁切。"
  - "配置控制层40/48px；两行标题层50/62px；输入与选择本体均88px；Switch small使用既有点击区域。"
  - "由宿主提供可用宽度；保留窄屏换行或独立表格滚动。"
compositionRules:
  - "2026-10-23用户授权本轮已审阅单元格规则入库：docs/ai/table-cell-actions.md。默认阅读轴稳定、图标18/12、头像24、图片32、浅Neutral hover与Brand选择；空值留白。identity的depth是宿主提供的视觉层级，leadingSpace同表共用，不把94px实例设为全部表格内距。"
  - "单元格模式仅Checkbox改变行选择；行首selection→move→add；字段按钮独立。父子独立、当前页含折叠行全选、批量范围、编辑缓冲/IME/校验/提交全部由宿主提供。UI不新建状态机。"
  - "TableInlineInput只能置于具备激活边界的TableActionCell中，内部去框但保留外部激活/错误边界；标准Input默认不变。短提示2–4字与完整无障碍标签分开。"
  - "数据引擎和业务状态留在调用方；公共 UI 不导入 TanStack。"
  - "多级表格浅竖线从表头延续到表体，原生colSpan合并区域内部不穿线；标题与控制层高度累加，整表同一密度。"
  - "未激活功能图标在悬停/焦点进入本列表头后显现，active/open入口持续可见并预留空间；无hover设备显露入口保证可操作。记录Checkbox与配置控件不隐藏。"
  - "字段范围/校验/草稿/保存和跨页选择协议由宿主管理；权重合计100%是业务示例，不内置于Table。"
  - "密度消费父 DensityProvider，不新增独立尺寸轴。"
allowedModifications:
  - "原生属性、语义内容、公开部件与布局 className。"
restrictedModifications:
  - "禁止在 UI 添加业务请求或更改既有品牌、Focus、字体。"
accessibility:
  - "表头 scope=col；排序宿主提供真实按钮及 aria-sort；使用 Caption 命名表格。"
  - "TableSortButton与TableHeaderAction保留Button/IconButton键盘、禁用、ref和浮层触发器语义；多级组标题使用scope=colgroup，叶列使用scope=col。"
  - "分页在横向滚动区之外，行菜单和选择控件保持原生焦点。"

compositionRules:
  - "Document under the Input family; keep the SearchInput export and asset ID for compatible shortcut usage."
  - "The inner Input and Button retain their own component and Part identities."
  - "Use one Input value state; typing does not submit and IME Enter never submits."
  - "Button and Enter share submit behavior; clear submits one literal empty query."
  - "Loading blocks button and Enter while leaving draft editing and clear available."
  - "Read-only allows searching current value; disabled blocks all actions."
  - "The query layer preserves other filters, ignores stale responses and owns latest-request Loading."
allowedModifications:
  - "Configure Input attributes and visible search label."
restrictedModifications:
  - "Do not duplicate Input editing state or own network requests."
accessibility:
  - "Native Input and TextButton semantics, focus retained after clear, loading action stays in place."

description: "明确提交查询的搜索字段；复用 Input 与文字按钮，输入草稿后通过按钮或 Enter 发出搜索意图。"
useWhen:
  - "输入内容与已提交查询分开，使用显式搜索动作；请求、结果与失败恢复由宿主拥有。"
  - "Typing creates a draft and explicit actions submit a query."
doNotUseWhen:
  - "既定交互为逐字即时过滤时使用 Input，不额外增加提交步骤。"
  - "The control must own requests, result data or asynchronous validation."
anatomy:
  - "Root"
parts:

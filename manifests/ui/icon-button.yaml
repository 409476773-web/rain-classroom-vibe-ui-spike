  - "hover"
  - "pressed"
  - "focus-visible"
  - "loading"
  - "disabled"
  - "disabled with loading indicator"
dependencies:
  - "@rain-next/foundations"
  - "Existing formal Icon assets"
  - "Existing native button and Local Recipe infrastructure"
tokens:
  - "Icon/Size/4,6,8,10,11,12,14,16,18,20,22,24,28,32,36"
  - "--rain-icon-button-control-*"
  - "--rain-icon-button-transition-*"
  - "--rain-icon-button-loading-*"
  - "Icon/Neutral/2 and Icon/Neutral/5"
  - "Icon/Brand/1 and Icon/Red/1"
  - "Fill/Neutral/Alpha/3 and /2"
  - "Fill/Brand/Alpha/4 and /3"
  - "Fill/Red/Alpha/2 and /1"
  - "Radius/6 and Radius/8"
  - "Shared control Focus and Motion"
sizes:
  - "18/11"
  - "20/12"
  - "20/14"
  - "24/12"
  - "24/14"
  - "24/16"
  - "28/12"
  - "28/14"
  - "28/16"
  - "28/18"
  - "28/20"

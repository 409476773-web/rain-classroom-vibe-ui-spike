sourcePath: "packages/ui/src/icon-button/icon-button.tsx"
styleSourcePath: "packages/ui/src/icon-button/icon-button.styles.ts"
sourceVersion: "local-2026-09-07"
publication: "unpublished"
description: "A compact native icon action with host-controlled persistent highlight and independently composed toggle/disclosure semantics."
useWhen:
  - "A single named action is represented by an icon."
  - "A host supplies a current outline/filled icon, toggle state or panel state."
  - "A table, tree, input or toolbar needs an explicitly sized action."
doNotUseWhen:
  - "A visible text action should use Button or Link."
  - "Navigation should use a link."
  - "A control needs internal business state, confirmation or a complete panel."
anatomy:
  - "Root"
  - "Icon"
  - "LoadingIndicator"
parts:
  - "root"
  - "icon"
  - "loading-indicator"
props:
  - "icon: one required current formal icon element"
  - "size: one complete control/icon recipe"
  - "tone: default or danger"
  - "highlight: none, icon or surface"
  - "loading"
  - "disabled"
  - "aria-label or aria-labelledby: required accessible name"
  - "native button attributes, events and ref"
  - "className: layout only"
  - "localRecipe"
slots:
  - "icon"
variants:
  feedback:
    - "fill"
  highlight:
    - "none"
    - "icon"
    - "surface"
  tone:
    - "default"
    - "danger: highlight none only"
states:

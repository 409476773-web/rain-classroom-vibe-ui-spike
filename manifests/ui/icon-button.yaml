  - "32/14"
  - "32/16"
  - "32/18"
  - "32/20"
  - "32/24"
  - "36/20"
densities:
  compactDefault: "32/18"
  defaultDefault: "36/20"
layoutConstraints:
  - "Explicit complete size wins over density; no secondary scaling."
  - "Controls 18 through 32 use radius 6; control 36 uses radius 8."
  - "The host owns positioning, spacing, visibility and adequate target separation."
compositionRules:
  - "The host supplies the current icon; highlight does not swap glyphs or infer ARIA."
  - "Use the confirmed icon pairs in docs/ai/icon-selection.md; star/heart collection, approval, applause, move-to-top and pin remain distinct intents."
  - "Applied filters and panel visibility remain separate states."
  - "Sidebar/directory expand and collapse show the next action; preserve the separate general-content and labeled-text-button arrow rules."
  - "Keep row actions visible while focused/open/loading; touch has an available entry."
  - "The host owns event isolation and focus return; do not nest interactive controls."
  - "Composed data-state is preserved; component availability is data-rain-state."
allowedModifications:
  - "Choose an approved complete size and highlight."
  - "Pass an available formal icon and explicit accessible name."
  - "Use named feature-scoped Local Recipes for declared Parts."
restrictedModifications:
  - "Do not infer outline/filled pairs from filenames or repaint source glyphs."
  - "Do not override operation blocking, accessible names or Focus in a visual recipe."
  - "Do not use raw colors, arbitrary visual values or default Tailwind visual tokens."
accessibility:
  - "Native button, type button by default; stable toggle name plus aria-pressed when appropriate."
  - "Disclosure uses aria-expanded/aria-controls from the host, not filter-applied state."
  - "Loading keeps focus, sets busy/unavailable and blocks click, pointer-trigger and activation-key handlers."
  - "Native disabled exits tab order; combined loading remains a disabled-colored spinner."
  - "Shared keyboard Focus, forced colors and reduced motion remain supported."
examples:
  - "#icon-button"
  - "#icon-sizes"
recipes:
  - "Fill default"
  - "icon-button-contained-emphasis: feature-scoped Local Recipe"
antiPatterns:
  - "Using one selected flag to conflate applied filters and expanded panels."
  - "Supplying an inaccessible icon-only action with title alone."
  - "Shrinking the click box to compensate for optical glyph padding."
relatedComponents:
  - "Button"
  - "Icon"
  - "Input"
relatedBlocks: []
visualLineage:
  rainClassicReferences:
    - "Rain Classic IconButton 17 size combinations and Fill/Emphasis feedback"
    - "https://www.figma.com/design/olqwu95QD6n4Y3IAwUdgF4?node-id=2244-285"
  externalReferences:
    - "https://www.radix-ui.com/primitives/docs/components/toggle"
    - "https://www.radix-ui.com/primitives/docs/guides/composition"
    - "https://www.w3.org/WAI/ARIA/apg/patterns/button/"
  retainedTraits:
    - "Centered cool-toned icon, transparent resting surface, complete optical size pairs"
  redesignedTraits:
    - "Public Icon Size, explicit highlight, 36/20 default and shared accessible Focus"
  intentionallyNotInherited:
    - "Classic 4px small-control radius and unconditional selected surface"
figmaMapping:
  status: "not-created"
migrationNotes:
  - "New component only; existing UI and all original icon assets retain their behavior."
  - "Tooltip composition is deferred until Tooltip is built."
verification:
  automated: "passed"
  independentReview: "passed"
  humanGate: "accepted"
  evidence: "evidence/runtime/icon-button/verification.md"

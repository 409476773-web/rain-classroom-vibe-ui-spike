layoutConstraints:
  - "Keep 6 / 4 px hit padding for default / compact; feedback protrusion extends bottom padding when needed."
  - "Size fixes body geometry; density changes spacing only. Do not clip or overlap targets."
compositionRules:
  - "Current means the question being viewed; it never implies answered or correct."
  - "Current uses solid brand fill, no border and weight 700; feedback stays visible."
  - "None is not inferred as unanswered; the host supplies one primary feedback state."
  - "Pending and reviewed use paired static ring icons, never loading animation."
  - "A host supplies parent/child context and owns navigation, grading progress and appeals."
  - "Business extensions may visually integrate progress or exception cues inside the question button or use other arrangements; no fixed placement is prescribed."
  - "Preserve distinct operation targets and avoid nested interactive controls."
allowedModifications:
  - "Choose size, shape, current and feedback through the public API."
  - "Use named feature-scoped Local Recipes for declared Parts."
restrictedModifications:
  - "Do not add business workflow fields, raw colors, private tokens or arbitrary visual values."
  - "Do not change current semantics, keyboard Focus or disabled behavior in a visual recipe."
  - "Do not redraw existing glyphs or replace them with text symbols."
accessibility:
  - "Native button, type button by default; host-controlled current exposes aria-current step."
  - "Visible question identity and feedback are included in the default accessible name."
  - "Hosts may provide contextual names and descriptions for child questions and business details."
  - "Native disabled blocks activation and leaves the tab order."
  - "Shared keyboard Focus is separate from the border-free current visual; forced colors preserve identification."

publication: "unpublished"
description: "从候选集中单选或多选的字段；可组合候选搜索、清空与完整键盘行为，适合筛选和表单条件。"
useWhen:
  - "展开面板需要在目标浏览器中使用统一 Rain 视觉；简单单选也使用本组件。"
  - "候选较多、标签较长或需要搜索时，使用 Select 选择筛选条件或字段值；由宿主拥有查询和生效范围。"
  - "Choose identities from a finite candidate set with complete value, search, clear and keyboard behavior."
doNotUseWhen:
  - "少量且需要持续可见的选项先比较 RadioGroup 或 CheckableTagGroup；独立操作列表使用 DropdownMenu。"
  - "Free creation, a tree/cascade, numeric editing, a form state store or a production overlay system is required."
anatomy:
  - "Root"
  - "Frame"
  - "Value"
  - "ClearAction"
  - "Arrow"
  - "SelectedValue"
  - "TagRemove"
  - "OptionsPanel"
  - "Search"
  - "Option"

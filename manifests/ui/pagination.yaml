  redesignedTraits:
    - "Single-line progressive disclosure, lighter navigation icons, primary capacity number with compact units, 24/28/32 recipes and popup-local jump feedback."
  intentionallyNotInherited:
    - "Vue state/composable code, private size popup, old raw colors, 30px large axis and hover-only focus treatment."
figmaMapping: "not-established"
migrationNotes: "RN-08 Pagination slice only; Table, Empty and BM-A completion are separate. No upstream code copied."

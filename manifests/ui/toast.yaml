props:
  - "Toaster: toastManager / timeout / limit 等 Base UI Provider Props; theme: light(default) / dark"
  - "createToastManager: 创建独立通知队列；add/update/close/promise 沿用 Base UI"
  - "add: title / description / type / timeout / actionProps；timeout=0 时持续展示"
  - "Toast / ToastContent / ToastTitle / ToastDescription / ToastAction / ToastClose / ToastViewport / ToastPortal / ToastProvider: Base UI Parts Props"
  - "useToastManager: Provider 内获取队列；Toaster 内置ToastList"
slots:
  - "children 与业务操作由宿主提供；Toast内容从manager事件传入。"
variants:
  - "沿用已审阅G2默认视觉；方向、尺寸与variant只按当前源码选择。"
states:
  - "队列、开始/结束、前台/叠放、展开、限流、关闭、计时暂停。"
dependencies:
  - "React"
  - "@rain-next/foundations"
  - "@base-ui/react@1.8.0"
  - "rainCn"
  - "ui-button (text variant with Toast-scoped inverse-foreground Recipe)"
tokens:
  - "现有Rain语义颜色、尺寸、圆角、间距、Focus与Motion；没有新增Token。"
layoutConstraints:
  - "Toast位于Viewport，队列尺寸来自Base UI测量；宿主拥有业务结果与持续入口。"
  - "默认顶部居中，顶边24px加安全区；队列向下叠放/展开，窄屏两侧至少16px。"
compositionRules:
  - "只处理通用状态和行为，宿主拥有业务数据、持久化、权限、路由和请求。"
  - "主题/密度经Toaster Portal传递；使用独立manager隔离兄弟实例。"
allowedModifications:
  - "内容、可访问名称、受控状态、源码已提供的Props及宿主className局部Recipe。"
restrictedModifications:
  - "不得改变共享Token、Base UI键盘/计时/队列规则或引入业务接口。"
accessibility:
  - "Base UI公告通知、F6进入/离开Viewport；暂停hover/focus计时，关闭及action有明确名称。"
  - "reduced-motion与forced-colors沿用既有G2合同；对比度接受独立记录。"

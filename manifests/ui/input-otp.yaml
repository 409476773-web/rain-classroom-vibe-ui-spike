sourceVersion: "shadcn-ui/ui@3ba91b1cc83e1bbe4ab35a422ff2a694849c5048; rain-adaptation-2026-10-14"
description: "单原生输入与可视槽位组成的验证码输入。"
useWhen:
  - "验证码/加入代码需要一个真实input与分组可视槽位。"
  - "需整段粘贴、选区、自动填充及原生FormData。"
doNotUseWhen:
  - "拆成多input/多Tab stop，或把onComplete当验证成功。"
  - "由组件发送验证码、管理重发倒计时、有效期和后端竞态。"
anatomy:
  - "root"
  - "group"
  - "slot"
  - "separator"
parts:
  - "root"
  - "group"
  - "slot"
  - "separator"
props:
  - "InputOTPProps=OTPInput1.4.2 Props + status=default|warning|error；maxLength必须正安全整数。"
  - "保留value/defaultValue/onChange(string)/onComplete、pattern/pasteTransformer、name/form、ref、inputMode/autoComplete、textAlign、pushPasswordManagerStrategy和noScriptCSSFallback。"
  - "render与children保留引擎互斥类型；className作用真实input，containerClassName作用可视容器；native size仍HTML含义。"
  - "Slot index为非负安全整数且必须在Root有效范围；显示char/placeholderChar/isActive/hasFakeCaret。"
  - "Group/Slot/Separator保持原生div属性/ref/className/style；不增加公共size枚举。"
slots:
  - "InputOTP"
  - "InputOTPGroup"
  - "InputOTPSlot"
  - "InputOTPSeparator"
variants:
  - "32px默认槽、24px紧凑；4/6位和3+3分组由组合表达。"
states:
  - "empty/filled/selected/focused/disabled/readOnly；default/warning/error反馈真实input并投影slot。"
dependencies:
  - "React19.2.8与Rain Foundations；rainCn依赖既有tailwind-merge3.6.0。"
  - "input-otp1.4.2"
  - "本项实际源码/内部helper/被动视觉依赖在Registry登记；消费仍为managed @rain-next/ui。"
tokens:
  - "默认Fill/Neutral/Solid/7、Text/Neutral/1、Border/Neutral/2；active品牌浅填充/边界和Focus。"
  - "warning Orange角色、error Red角色；disabled中性弱化，placeholder Text/Neutral/4。"
  - "slot Space32/24、Line1、Radius6；caret1×16及1秒周期为来源局部事实。"
layoutConstraints:
  - "FormItem top标签关联真实单input；错误Group/slot根据真实aria-invalid反馈。"
  - "logical border/corners；保留password-manager宽度策略与no-JS降级，不为截图关闭。"
compositionRules:
  - "onComplete仅长度完成；宿主验证失败保留值并给原因，字母数字模式显式inputMode=text及pattern。"
allowedModifications:
  - "使用本条列出的真实Props/ref/className/style；仅source已提供的Parts支持render/localRecipe，不把通用模板当API。"
  - "视觉用既有Rain Token/具名局部方案；已登记源几何/动效差额不升级全局Foundation。"
restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "FormItem的id/labelledby/describedby/error/required/disabled并入真实input，field状态优先、禁用合并。"
  - "展示slot不加独立字段名/Tab stop；Separator与fake caret装饰隐藏。"
  - "reduce稳定显示caret，forced-colors保留边界/Focus。"
examples:
  - "apps/playground/src/docs/components/g6-interaction-pages.tsx"
recipes:
  - "通过实际className/containerClassName组合具名局部方案；没有localRecipe属性。"
antiPatterns:
  - "拆成多input/多Tab stop，或把onComplete当验证成功。"
  - "由组件发送验证码、管理重发倒计时、有效期和后端竞态。"

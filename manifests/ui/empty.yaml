  implementationRole: "root"
  controlScope: "无内容或无搜索结果的解释和动作结构"
  stateOwner: "宿主判断空状态原因、筛选条件与恢复动作；Empty Parts 只组织信息，不发请求或清除筛选。"
  relationships: []

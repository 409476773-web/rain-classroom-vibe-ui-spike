id: "layout-workspace"
name: "WorkspaceLayout / RecoverableRegion"
sourcePath: "packages/layouts/src/workspace.tsx"
styleSourcePath: "packages/layouts/src/workspace.css"
description: "Recoverable layout regions with one controller, stable recovery, overlay ownership, focus, resize and injected storage."
useWhen:
  - "Multiple independently hideable regions or nonmodal temporary panels must preserve business state."
doNotUseWhen:
  - "A fixed two-column layout only needs existing Split."
  - "Business objects, grades, drafts or media data need ownership."
anatomy:
  - "Workspace root"
  - "stable toolbar/ribbon slots"
  - "horizontal flow"
  - "single mounted region body"
  - "external restore control"
  - "one boundary splitter"
parts:
  - "root"
  - "workspace-flow"
  - "region-slot"
  - "region"
  - "restore"
  - "splitter"
props:
  - "WorkspaceLayout: spec, viewportWidth?, preferences?/onPreferencesChange, storage?/storageKey, hoverPreview=false, toolbar?, ribbon?, children."
  - "RecoverableRegion: regionId, header?, footer?, children or render({region,effective,temporary,visible}), topHeights?/topTemporaryHeight?."
  - "RegionRestoreTrigger: regionId, intent=toggle|peek, native button props; supports top Ribbon modes."
  - "PaneSplitter: regionId and native div props; physical arrow direction for end panes."
slots:
  - "toolbar and ribbon stay above the region flow; both can consume useWorkspaceLayout."
  - "Native caller body can nest region slots, with one Workspace controller for the complete scene."
variants:
  - "start/end region; global compact rail; top Ribbon"
  - "controlled/uncontrolled; storage injected; optional hover"
states:
  - "expanded"
  - "compact"
  - "hidden"
  - "temporary"
  - "pinned"
  - "forced-space"
  - "focused"
  - "controlled-pending"
dependencies:
  - "React"
  - "@rain-next/foundations"
  - "workspace-state.ts"
tokens:
  - "Candidate scoped CSS values matched to approved reference; no new Foundation defaults."
layoutConstraints:
  - "Valid restore dependency graph; real host measurement; per-region widths and minimum main budget."
  - "Temporary panels reserve the previous compact/hidden occupancy; hidden DOM is inert."
compositionRules:
  - "One controller per workspace and stable spec key per user/workspace/subscene/instance."
  - "No style/mode/theme key that remounts business roots."
  - "Built-in restore controls select only allowedModes; single-mode/no-action controls are disabled."
accessibility:
  - "Native named recovery button with aria-controls/expanded; hidden body inert."
  - "Separator has orientation/name/min/max/current and keyboard operation; Enter chooses hidden, otherwise compact, and returns focus to recovery. Without either mode Enter retains state/focus."
  - "Existing popup handles Escape before a workspace temporary layer; one active workspace reacts."

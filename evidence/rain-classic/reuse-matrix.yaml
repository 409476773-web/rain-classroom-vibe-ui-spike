  cp2:
    confirmedAt: "2026-09-02"
    decisionSource: "explicit-user-confirmation"
    relationshipMap: "accepted"
    domainBusinessTags: "base-library-domain-group"
    domainBusinessTagsBoundary: "Keep all seven assets as identity domain in a dedicated base-library Domain tag group; do not flatten business semantics into arbitrary generic Tag visual variants."
    retireCandidates: "retire-direction-accepted-pending-task-7-unique-visual-value-check"
    rainNextRedesignDirection:
      dialog: "accepted"
      surfaceCard: "accepted"
      statistic: "accepted"
    implementationAuthorization: "not-authorized"

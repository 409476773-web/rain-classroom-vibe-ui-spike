  cp3:
    updatedAt: "2026-09-02"
    acceptedAt: "2026-09-02"
    decisionSource: "explicit-user-confirmation"
    status: "accepted"
    gateA: "accepted-all-47-source-and-direction-records"
    gateB: "accepted-retire-direction-with-pre-retirement-unique-visual-value-review"
    gateC: "accepted-rewrite-from-rain-to-ui-for-checkbox-group-and-radio-group"
    gateE: "accepted-rain-next-8-plus-4-source-map"
    implementationAuthorization: "not-authorized"
    figmaAuthorization: "not-authorized"
    publicationAuthorization: "not-authorized"
    businessMigrationAuthorization: "not-authorized"
    gitAuthorization: "not-authorized"
    gateD:
      status: "accepted-with-deferred-implementation-and-interaction-gates"
      totalItems: 20
      resolvedItemCount: 20
      resolvedItems:
        - asset: "rain-classic/foundation/semantic-icon-registry"
          decision: "accepted-recommendation"
          rule: "Ordinary functional icons inherit the color of their host text or control."
          exception: "A fixed-color named exception is allowed only when color is part of the icon identity; governed geometry must not change."
        - asset: "rain-classic/template/tree-management-page"
          decision: "accepted-recommendation"
          rule: "Only actual learning-task nodes require a task type; chapter and organizational nodes do not."
          followUpEvidence: "Align the scenario data and validation scope, then rerun the variation save, save-error and conflict paths in a later implementation Gate."
        - asset: "rain-classic/pattern/query-table"
          decision: "accepted-recommendation"
          rule: "QueryTable owns the reusable filter, submit, reset, pagination, sorting, loading and empty-result experience; the application owns data access, permissions and domain rules."
          boundary: "Connect application data through an explicit request port or Domain Adapter without embedding business request knowledge in the shared Pattern."
        - asset: "rain-classic/ui/editable-cell"
          decision: "accepted-recommendation"
          rule: "EditableCell is a reusable table-editing Pattern that owns the consistent edit, validation, cancel, saving and failure-retention experience."
          boundary: "The application owns permissions, persistence, acknowledgement and final business outcomes; feedback is composed through a public slot rather than a required dependency on the excluded Classic Message implementation."
        - asset: "rain-classic/ui/tabs"
          decision: "accepted-recommendation"
          rule: "Tabs overflow reuses the canonical internal Popup mechanics while Tabs retains its own tab, selection and overflow-list semantics."
          density: "Rain Next initially exposes compact and default only; add a separate size axis only after real consumer evidence proves it necessary."
        - asset: "rain-classic/ui/button"
          decision: "accepted-direction-deferred-full-gate"
          rule: "Keep the rewrite-from-rain direction without treating the current browser review as a complete Button pass."
          followUpEvidence: "Rain Next implementation Gate must verify trusted keyboard activation and the complete hover, active, focus, disabled, loading and target visual-state matrix."
        - asset: "rain-classic/ui/container"
          decision: "accepted-direction-deferred-layout-gate"
          rule: "Container owns content width and horizontal inset only; Surface or Card owns visual surface treatment, and the page or dedicated scroll owner owns scrolling."
          followUpEvidence: "The later Rain Next Layout Gate must verify responsive behavior at the required desktop widths, transparent ownership, semantic output and correct single-scroll composition."
        - asset: "rain-classic/ui/pane-group"
          decision: "accepted-direction-deferred-layout-gate"
          rule: "PaneGroup remains the general owner of multi-pane geometry, resize and collapse behavior; Split and Sidebar remain separate compositions built from it rather than aliases."
          referenceComparison:
            - "shadcn/ui separates Resizable panel mechanics from its composable and responsive Sidebar system."
            - "Ant Design separates Splitter panel sizing and collapse mechanics from Layout.Sider navigation and breakpoint behavior."
          borrowedPractices:
            - "Composable group, panel and handle parts with keyboard-operable resizing."
            - "Explicit initial, minimum, maximum and controlled sizes plus observable resize and collapse transitions."
            - "A dedicated navigation Sidebar composition with its own desktop and narrow-screen behavior."
          retainedRainEducationRules:
            - "Protect one fluid Main work area from being squeezed below its usable minimum."
            - "Use an explicit collapse priority for Navigation and Inspector regions rather than hiding Main."
            - "Return focus to a persistent external control when a pane is removed, then restore the same content without duplication."
            - "Keep one intended scroll owner per axis and leave DataTable, Tree, ManageTree and popup content semantics with their consumers."
            - "Use Rain visual tokens and education-workflow roles instead of copying shadcn/ui or Ant Design default appearance."
          followUpEvidence: "The later Rain Next Layout Gate must verify trusted pointer resizing, narrow-viewport behavior, protected Main width, restoration and correct scroll ownership."
        - asset: "rain-classic/internal/popup"
          decision: "accepted-private-shared-primitive-headless-deferred"
          rule: "Create one non-public canonical Popup primitive that owns shared opening, closing, positioning, mounting, outside or Escape dismissal and focus-return mechanics."
          consumerBoundary: "Select, Tooltip, Popover, overflow menus and other public consumers continue to own their purpose, content, accessible role, name and keyboard interaction model; business pages must not bypass those components through a generic public Popup."
          referenceComparison:
            - "shadcn/ui exposes purpose-specific Popover, Tooltip, Select and Dropdown Menu components while their Headless foundations share lower-level overlay mechanics."
            - "Ant Design also exposes purpose-specific components while centralizing popup-container, placement, overflow and theme configuration."
          borrowedPractices:
            - "Use composable Trigger and Content relationships without erasing the public consumer's meaning."
            - "Keep placement, viewport adjustment, outside or Escape closing and focus return consistent across consumers."
            - "Make local versus page-root mounting an explicit consumer choice rather than an invisible global guess."
          retainedRainEducationRules:
            - "Popup content inside DataTable, Tree, ManageTree and PaneGroup scenarios must respect the intended scroll owner and remain visible near viewport edges."
            - "Rain theme tokens and readable education-workflow density must propagate whether content mounts locally or at the page root."
            - "Use one canonical internal identity; do not let _Popup, MenuSurface or consumer-private controllers become competing popup systems."
          deferredDecision: "Choose the specific Headless foundation later through a separate Select and Dialog comparison ADR; this confirmation does not select Base UI, Radix UI, React Aria or another library."
          followUpEvidence: "A later interaction Gate must verify real outside click, Escape, Tab order, focus return, edge adjustment, scroll-container behavior, mounting cleanup and theme propagation for representative consumers."
        - asset: "rain-classic/pattern/manage-tree"
          decision: "accepted-pattern-transaction-boundary"
          rule: "ManageTree owns the complete editing session: local draft, validation, explicit atomic save, cancel and failure recovery; these responsibilities must not be absorbed into the general Tree component."
          treeBoundary: "Tree owns hierarchy presentation, expansion, selection, checking, keyboard navigation and drag proposals, but it does not own editing transactions, permissions or persistence."
          applicationBoundary: "The application or Domain Adapter owns authoritative permissions, backend connection, revision truth and course-specific rules; ManageTree coordinates them through explicit ports without embedding business requests."
          popupBoundary: "Node editors and action menus reuse the canonical internal Popup mechanics while ManageTree continues to own their editing purpose, allowed actions and transaction state."
          referenceComparison:
            - "shadcn/ui currently provides composable fields, dialogs and menus but no official Tree or ManageTree, reinforcing composition rather than a universal tree editor."
            - "Ant Design Tree owns controlled hierarchy, selection, search and drag behavior while Form and Dropdown remain separate; it does not define product save, permission or recovery policy."
          retainedRainEducationRules:
            - "Only actual learning-task nodes require a task type; chapter and organizational nodes do not."
            - "Allow only one active editor or editing surface at a time so competing node edits cannot silently overwrite one another."
            - "A save is all-success or all-failure; partial-success persistence is not accepted."
            - "On validation, permission, network or revision failure, retain the teacher's draft, expanded path and selected node until they cancel or successfully retry."
            - "Cancel restores the latest committed course structure without inventing an autosave path."
          followUpEvidence: "A later interaction Gate must verify exit-edit, switching to another editor, action-menu competition, permission denial, validation failure, cancel, retry completion and revision-conflict recovery with trusted input."
        - asset: "rain-classic/ui/avatar-group"
          decision: "accepted-consumer-semantics-shared-popup-deferred-interaction-gate"
          rule: "AvatarGroup owns member aggregation, visible-versus-overflow counting, member names, overflow-list structure and keyboard semantics while reusing the canonical internal Popup for overlay mechanics."
          applicationBoundary: "The application owns member roles, permissions, detail destinations and business actions; AvatarGroup must not infer them from avatar presentation."
          referenceComparison:
            - "shadcn/ui composes AvatarGroup and AvatarGroupCount as clear visual parts, leaving richer overflow surfaces to separate Hover Card, Popover or menu composition."
            - "Ant Design Avatar.Group provides maximum-count and Popover configuration, including multiple trigger modes; Rain borrows the completeness without moving generic Popup ownership into AvatarGroup."
          retainedRainEducationRules:
            - "When there is no overflow, show all members and no More control; with overflow, reserve the final visible slot for a correctly named remaining-count button."
            - "The More trigger exposes an accessible name equivalent to 'N more members' and remains distinct from any whole-group action."
            - "Hover may be a convenience preview but cannot be the only path; pointer click and keyboard activation must remain available."
            - "Escape returns focus to the More trigger; static member names do not become unnecessary Tab stops, while real member actions use explicit links or buttons."
            - "Member-list content uses Rain tokens and education-admin density and keeps its own intended scroll boundary for long rosters."
          deferredInteractionDecision: "Exact hover delay, click pinning, focus-open behavior, Tab order within interactive member content and touch behavior remain for a later trusted interaction Gate."
          followUpEvidence: "Verify More and overflow hover or focus paths, click pinning, outside and Escape dismissal, focus return, natural Tab order, touch input, edge positioning and long-roster scrolling."
        - asset: "rain-classic/ui/pagination"
          decision: "accepted-ant-complete-functional-coverage-rain-rewrite"
          rule: "Rain Next Pagination should cover the complete mature Ant Design-style functional matrix rather than limiting itself to the minimal page-link composition."
          featureCoverage:
            - "Previous, next, numbered pages, deterministic ellipsis, current page and disabled states."
            - "Controlled and uncontrolled current page and page size, total and visible range, single-page visibility policy and configurable alignment."
            - "Page-size changer with configurable options, direct page jumper, simple mode, reduced-item or responsive presentation and consumer-provided item rendering where justified."
            - "Known-total and unknown-total operation plus normalized, clamped and deterministic state transitions."
          popupBoundary: "The page-size changer reuses the canonical internal Popup and Rain Select semantics rather than importing an Ant Design Select or creating a private overlay."
          applicationBoundary: "Pagination proposes page and page-size changes; QueryTable or the application owns data requests, filters, sorting, permissions, loading and business errors."
          rainBoundary: "Complete Ant Design-style feature coverage does not authorize copying Ant Design default visuals, code, dependency, component API names or automatic product policy; rendering remains a Rain rewrite using Rain tokens, Chinese labels and education-admin density."
          retainedRainEducationRules:
            - "Changing page size preserves the first visible record when possible and clamps to the nearest valid page when the old page disappears."
            - "After ordinary activation, focus remains on the activated pagination control when that control still exists; the size changer returns focus to its trigger on close."
            - "Query filter reset policy remains with QueryTable or the application rather than being silently inferred by Pagination."
          followUpEvidence: "A later interaction Gate must verify trusted pointer and native keyboard activation, stable control identity, focus retention or fallback, page-size Popup behavior, direct-jump IME input, responsive presentation and all complete-coverage modes."
        - asset: "rain-classic/ui/popover"
          decision: "accepted-named-nonmodal-consumer-shared-popup"
          rule: "Popover is a named, non-modal lightweight rich-content or action surface; the canonical internal Popup owns only opening, closing, positioning, mounting and dismissal mechanics."
          semanticBoundary: "Popover owns its visible or accessible title, description, non-modal dialog semantics, content structure, Tab behavior and focus rules."
          referenceComparison:
            - "shadcn/ui composes Popover Trigger and Content with optional Header, Title and Description and demonstrates modest form content."
            - "Ant Design distinguishes Tooltip information from Popover information plus actions and provides broad trigger, placement and overflow behavior; Rain borrows this completeness without making Popover a universal floating container."
          usageBoundary:
            - "Use Tooltip for short supplementary description."
            - "Use Popover for modest supplementary information or a small set of lightweight actions."
            - "Use Dialog, Sheet or a dedicated page region for complex forms, long editing workflows or consequential confirmation."
          retainedRainEducationRules:
            - "Interactive Popover content must be available by click and keyboard; hover may only be an additional convenience path."
            - "Tab enters real controls in a natural order, while Escape or outside dismissal returns focus to the trigger when appropriate."
            - "Support text, images, small tables and limited actions, but not audio, video or complex workflows."
            - "Inside DataTable, Tree and PaneGroup scenarios, avoid clipping and accidental nested scrolling while retaining Rain surface, motion and focus tokens."
          followUpEvidence: "A later interaction Gate must verify hover or focus opening where applicable, outside dismissal, Tab order, Escape focus return, viewport-edge adjustment, scroll-container behavior, local-versus-page-root mounting and theme inheritance."
        - asset: "rain-classic/ui/row-reorder"
          decision: "accepted-pattern-draft-order-business-persistence"
          rule: "RowReorder owns temporary order, pointer and keyboard reorder interaction, cancellation and rollback proposals; the application owns authorization, persistence acknowledgement, failure policy and revision conflicts."
          patternBoundary:
            - "Use a dedicated drag handle, stable row keys, visible drop position and explicit temporary-versus-committed order."
            - "Default to an explicit Save or Apply flow; automatic commit requires separate real-scenario evidence."
            - "On persistence failure, retain the temporary order and expose retry or cancel-to-restore rather than silently resetting or claiming success."
          applicationBoundary: "The application supplies the authoritative dataset scope, permissions, save port, acknowledgement, canonical order and conflict result."
          referenceComparison:
            - "shadcn/ui Data Table does not ship a built-in row-reorder transaction and expects advanced behavior to be composed as an application feature."
            - "Ant Design demonstrates Table row drag sorting by integrating dnd-kit, but the example does not own business persistence, permission or failure recovery."
          retainedRainEducationRules:
            - "Declare whether reorder applies to the current view or the complete dataset; never imply that current-page movement changed all data."
            - "Manual order and active field sorting cannot silently coexist; enter an explicit manual-order mode or disable reorder while another sort is active."
            - "RowReorder handles flat peer rows only; hierarchy and reparenting remain Tree or ManageTree responsibilities."
            - "Announce the moved item and old or new position, preserve focus and offer Escape cancellation."
          followUpEvidence: "A later interaction Gate must verify trusted pointer reorder, Space and Arrow keyboard movement, Escape cancellation, always-versus-mode handles, explicit-versus-auto flows, focus retention, live announcement and retry or cancel recovery."
        - asset: "rain-classic/ui/select"
          decision: "accepted-rain-select-shared-popup-headless-deferred"
          rule: "Rain Next Select retains Rain visual lineage, Chinese IME safety, single and multiple selection, search and distinct focus, open, active-option and selected-value states while learning composable structure and keyboard behavior from shadcn/ui and mature administration coverage from Ant Design."
          selectBoundary:
            - "Select owns value selection, option navigation, search text, keyboard interaction, Chinese IME composition, clear behavior, loading and empty-result presentation."
            - "MenuItem owns each option row, while the canonical internal Popup owns only opening, closing, positioning, mounting, outside or Escape dismissal and focus-return mechanics."
            - "TagSelect remains a separate bounded component identity and must not be folded into Select as an undifferentiated tags mode."
          applicationBoundary: "The application or Domain Adapter owns real data requests, permissions, remote-result policy and domain rules; Select exposes explicit state and request ports without embedding business access logic."
          referenceComparison:
            - "Borrow shadcn/ui's clear Trigger, Value, Content, Group, Label, Item and Separator composition plus disciplined keyboard and focus behavior."
            - "Borrow Ant Design's mature administration-state coverage for single or multiple selection, search, clear, loading, empty results and maximum-count behavior without copying its visuals, code or oversized public API."
          retainedRainEducationRules:
            - "Chinese IME composition must not accidentally commit an option, close the popup or trigger a premature remote query."
            - "Focus, popup-open, active option and selected value must remain visually distinct so keyboard users can tell where they are and what is already chosen."
            - "Use Radio for a very small stable choice set and a dedicated AutoComplete or Combobox for free text with suggestions instead of silently stretching Select into every input pattern."
            - "Virtualize very large option lists only when real dataset evidence requires it, and keep multiple-selection limits and overflow counts explicit."
          deferredDecision: "Choose the specific Headless foundation later through one shared Select and Dialog comparison ADR; this confirmation does not select Base UI, Radix UI, React Aria or another library."
          followUpEvidence: "A later interaction Gate must verify trusted keyboard opening and navigation, Chinese IME composition, single and multiple selection, clear, loading and empty states, outside dismissal, Tab order, focus return, viewport-edge and scroll-container behavior, local-versus-page-root mounting and theme inheritance."
        - asset: "rain-classic/ui/tag-select"
          decision: "accepted-distinct-bounded-single-value-tag-switcher"
          rule: "Keep TagSelect as a distinct compact current-tag switcher for a finite local option set; it is always single-select and always has a valid current value."
          tagSelectBoundary:
            - "TagSelect owns the current tag presentation, trigger meaning, option navigation and the distinction among pointer-open, keyboard focus, active option and selected value."
            - "It does not create arbitrary user-entered tags, provide multiple selection, own remote requests or expand into the general Select feature surface."
            - "The canonical internal Popup owns only opening, closing, positioning, mounting, outside or Escape dismissal and focus return; MenuItem owns each option row."
          routingRules:
            - "Use CheckableTagGroup or Radio when a very small choice set should remain visible at the same time."
            - "Use Select for ordinary forms, larger or remote datasets, multiple selection, loading and complex search."
            - "Use TagSelect only when a compact education-admin surface must show and switch one current category or tag value in place."
          applicationBoundary: "The application supplies the finite valid values, their domain meaning and permissions; TagSelect does not infer business status, color identity or access rules."
          referenceComparison:
            - "shadcn/ui has no dedicated TagSelect and composes Badge or tag-like presentation with Combobox or menu primitives when such a product-specific switcher is needed."
            - "Ant Design separates Tag and CheckableTag from Select; its Select tags mode allows multiple or newly entered values and therefore does not match Rain TagSelect's bounded single-value identity."
          retainedRainEducationRules:
            - "A registered domain tag may retain its governed semantic color, but TagSelect must not expose arbitrary free color selection."
            - "Selecting the current value closes without emitting a duplicate value change, and disabled options remain unavailable to pointer and keyboard input."
            - "Default to no search for a short finite list; optional local search requires real option-count evidence and never becomes a hidden remote-query path."
          deferredDecision: "TagSelect reuses the same future Headless family and canonical Popup decision as Select where applicable, but remains a separate public Rain component contract."
          followUpEvidence: "A later interaction Gate must verify pointer and keyboard opening, active-versus-selected state, optional local search, current-value reselection, outside and Escape dismissal, Tab order, focus return, viewport-edge and scroll-container behavior, mount mode, theme inheritance and touch input."
        - asset: "rain-classic/ui/text-button"
          decision: "accepted-merge-into-button-and-link-recipes"
          publicIdentity: "not-independent-in-rain-next"
          rule: "Do not publish TextButton as a third overlapping Rain Next public component: low-emphasis actions use Button, while navigation uses Link with the same governed Rain text-action visual recipe."
          semanticRouting:
            - "Use a native Button low-emphasis text presentation for editing, retrying, opening a Dialog or Popover and other immediate actions."
            - "Use a native Link for page, document or location navigation, while reusing the same visual recipe when the product needs low emphasis."
            - "SearchInput or other compound consumers use the shared low-emphasis action capability rather than depending on a public TextButton identity."
          retainedSourceValue:
            - "Preserve the Classic TextButton color, spacing, icon order, loading, disabled, danger and focus evidence as source material for the Button and Link recipes."
            - "Do not delete the Classic source files in this audit; later implementation must provide an explicit old-name-to-new-usage migration note."
            - "One visible label with optional leading or trailing icons remains one click target; icons never become independent actions."
          referenceComparison:
            - "shadcn/ui exposes low-emphasis and link-like Button variants but explicitly recommends styling a native anchor with the shared button recipe for real navigation instead of overriding link semantics."
            - "Ant Design places text and link presentations inside Button; Rain borrows the complete visual-state coverage but keeps action and navigation as explicit semantic branches."
          retainedRainEducationRules:
            - "A low-emphasis text action cannot replace the only primary submit or completion action in a region."
            - "Table actions such as Edit use Button semantics, while destinations such as View details use Link semantics even when their visual emphasis matches."
            - "Danger text treatment is allowed only for a genuinely risky contextual action, not as decorative color."
          followUpEvidence: "The Rain Next Button and Link implementation Gates must verify native keyboard activation, visible focus, target size, action-versus-navigation semantics, leading or trailing icons, loading, disabled and danger states before the Classic public TextButton identity can be retired."
        - asset: "rain-classic/ui/tooltip"
          decision: "accepted-supplementary-description-only"
          rule: "Tooltip provides only a short supplementary description; the real trigger must retain its own visible or programmatic accessible name, purpose and interaction semantics."
          tooltipBoundary:
            - "Tooltip owns short plain-text content, the description relationship to one real trigger, hover delay, immediate focus opening and Escape, blur or pointer-leave dismissal."
            - "Tooltip never receives focus, contains no buttons, links, images, tables or other interactive or rich content, and does not support click pinning."
            - "The canonical internal Popup owns positioning, mounting, viewport adjustment and cleanup mechanics without owning the Tooltip's descriptive meaning."
          triggerBoundary:
            - "IconButton, Button, Link, truncated text or another trigger remains responsible for its own accessible name, click or navigation behavior, disabled state and focus treatment."
            - "Tooltip text cannot repair or conceal an unnamed icon-only control; the control's name must exist even if the Tooltip never opens."
          routingRules:
            - "Use Tooltip for a short non-interactive hint or the full text of a visually truncated label."
            - "Use Popover for richer information, click-pinned content or any interactive control."
            - "Keep essential course instructions, validation, errors and persistent feedback visible in the page or their dedicated components instead of hiding them only in Tooltip."
          referenceComparison:
            - "shadcn/ui uses Trigger and Content composition and exposes the hint on pointer hover or keyboard focus."
            - "Ant Design provides delays, twelve placements and automatic edge adjustment; Rain adopts this completeness but makes keyboard-focus access a default requirement rather than an optional configuration."
            - "The W3C Tooltip pattern keeps focus on the trigger, dismisses with Escape and connects Tooltip as a description rather than a replacement control name."
          retainedRainEducationRules:
            - "Use the governed Rain Tooltip surface, typography, spacing and arrow geometry without exposing arbitrary per-instance colors."
            - "Touch users and users who never hover must not lose essential information; provide a persistent or otherwise explicit path when the information is required."
            - "Only one Tooltip describes a trigger, and a Tooltip cannot be nested inside another Tooltip."
          deferredDecision: "Tooltip reuses the same future Headless family and canonical Popup decision where applicable; this confirmation does not choose the technical library."
          followUpEvidence: "A later interaction Gate must verify pointer and keyboard exposure, delay and leave behavior, Escape, blur and Tab dismissal, focus retention, touch alternatives, viewport-edge and scroll-container positioning, local-versus-page-root mounting, cleanup and theme inheritance."
        - asset: "rain-classic/ui/tree"
          decision: "accepted-ant-complete-functional-coverage-rain-rewrite"
          rule: "Rain Next Tree should cover the complete mature Ant Design-style functional and state matrix while remaining a Rain rewrite with explicit hierarchy, interaction and business boundaries."
          featureCoverage:
            - "Controlled and uncontrolled expansion, single or multiple selection, cascading or strict checking, half-checked state, disabled nodes and independent focus, selected, checked, active and expanded states."
            - "Async loading with loading, failure, retry and completion feedback; external search or filtering that reveals ancestor paths without deleting hidden selection truth."
            - "Custom switchers, governed icons, guide lines, Basic, Checkable, Rich and Draggable presentations plus explicit empty and search-empty outcomes."
            - "Large fixed-height dataset virtualization with visible-position metadata, while naturally sized Rich content remains outside fixed-row virtualization."
            - "Dedicated-handle pointer and keyboard drag proposals for before, inside and after positions, with allow or reject validation and observable drag outcomes."
          modelBoundary:
            - "HierarchyModel owns pure parent-child structure, stable identity, visible projection and structural validation without rendering, permissions or persistence."
            - "DragDropModel validates a proposed move and returns an immutable proposal; Tree displays and operates on the proposal but does not silently mutate authoritative business data."
            - "Tree owns the visual viewport, expansion, focus, selection, checking, loading and drag interaction outcomes."
          applicationBoundary: "ManageTree or the application owns editing drafts, course permissions, backend connection, atomic save, failure recovery, revision conflicts and domain rules."
          rainBoundary:
            - "Complete Ant Design-style functional coverage does not authorize copying Ant Design visuals, code, dependency, public API names or default product policies."
            - "TreeSelect, DirectoryPicker, TreeTable, bulk business actions and ManageTree transactions remain separate components or compositions rather than modes hidden inside Tree."
            - "Switcher, row selection, Checkbox and node actions retain separate hit targets and state meanings."
          densityCoverage:
            - "Basic Tree retains Compact and Default row density."
            - "Rich Tree retains Compact, Default and Spacious content spacing as its own rich-content axis; Spacious does not become a universal third Basic Tree row height."
          referenceComparison:
            - "shadcn/ui currently has no official Tree, so Rain must own and verify its public contract rather than adopting an ungoverned community implementation."
            - "Ant Design supplies the mature coverage reference for controlled expansion, selection, checking, async loading, drag and virtualization."
            - "The W3C Tree View pattern supplies keyboard and accessibility expectations, especially the separation of keyboard focus from selected state."
          retainedRainEducationRules:
            - "Expansion changes visibility, row activation changes selection, Checkbox changes checked truth and Actions run their own operation; one click cannot silently change all four."
            - "Async or filtered trees preserve hidden selection intent and explain loaded versus global impact where course descendants are incomplete."
            - "Pointer drag starts only from the dedicated handle, rejected targets receive immediate feedback and accepted moves remain proposals until the business owner confirms persistence."
          followUpEvidence: "A later Tree implementation Gate must verify the complete feature matrix, W3C keyboard navigation, focus-versus-selection visuals, async and filtered truth, fixed-height virtualization, Rich natural height, trusted pointer and keyboard drag, rejection feedback and proposal-to-persistence handoff; current pointer drag remains browser-blocked rather than passed."
        - asset: "rain-classic/ui/tree-node"
          decision: "accepted-documented-tree-compound-not-standalone"
          publicIdentity: "tree-compound-subcomponent-only"
          rule: "TreeNode remains a formal configurable subcomponent documented inside Tree, but it is not a standalone Rain Next component that pages may use outside a Tree context."
          treeNodeBoundary:
            - "TreeNode renders one governed tree row with switcher, drag handle, Checkbox, leading content, title, description, metadata, actions and independent visual states supplied by Tree."
            - "Tree owns hierarchy data, expansion, focus, selection, checking, virtualization and drag interaction; TreeNode owns none of those state machines independently."
            - "Node actions remain separate controls that do not trigger row selection, while Rich node content stays configurable through the Tree compound contract."
          designerBoundary: "Figma and documentation may expose TreeNode as a nested Tree construction part for configuring node presentations, but it does not appear as a general-purpose standalone page component."
          referenceComparison:
            - "Ant Design documents TreeNode properties inside the Tree API and primarily manages nodes through the complete Tree data and state contract."
            - "The W3C treeitem role is meaningful only inside a tree or group relationship, supporting contextual rather than standalone use."
          futureReopenRule: "Only a proven independent consumer with complete hierarchy, keyboard and state ownership may reopen a future Human Gate for a standalone TreeNode public identity."
          followUpEvidence: "TreeNode focus, selection, checking, actions, Rich composition and drag states are verified through the complete Tree implementation Gate; current Tree pointer drag remains browser-blocked, and no independent TreeNode drag pass is claimed."
      canonicalStatusApplication: "applied-after-explicit-cp3-acceptance"

description: "截止时刻、日期范围与日期时间范围；内置起止标题、单一HH:mm输入、显式日历端点和可展开时长，确认后提交。"
useWhen:
  - "截止时间、开放区间等需要审阅草稿再确认。"
doNotUseWhen:
  - "自由文本解析、秒、复杂时区或排班。"
anatomy:
  - "field frame / display trigger"
  - "Popover / bottom Sheet / FormItem inside + 日期 Input / 私有 TimeField(Input) / Calendar / presets / duration disclosure / derived summary / error / actions"
parts:
  - "field frame / display trigger"
  - "endpoints / date-input / time-field / presets / calendar / duration / summary / draft-hint / clear / cancel / confirm"
props:
  - "mode=single:Date|null；mode=range:DateRange{from:Date,to:Date}|null；showTime。"
  - "value / defaultValue / onValueChange；open / defaultOpen / onOpenChange；defaultMonth；minDate / maxDate / disabledDates。"
  - "size / appearance / status / disabled / readOnly / required；trigger ref。"
  - "presets: mode=single 使用 DatePickerPreset<Date>[]；mode=range 使用 DatePickerPreset<DateRange>[]；getValue(now)在点击时计算。"
  - "timeStep=5|15|30 默认15，兼容保留并校验合法值；已移除建议列表，不限制手输分钟或改变方向键1分钟步长。"
  - "仅range+showTime：durationPresets/minDurationMinutes/maxDurationMinutes；默认最短0分钟，教学窗口显式1分钟。"
  - "仅range：excludeDisabled默认true；false允许跨禁用日，但两端仍不可选禁用日期。"

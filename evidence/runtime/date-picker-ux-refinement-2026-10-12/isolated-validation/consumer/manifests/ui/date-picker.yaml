  - "react"
  - "react-day-picker@9.13.2"
  - "Calendar / Popover / Sheet / Input / IconButton / Button / FormItem / fieldFrameRecipe"
tokens:
  - "shared field / popup / Calendar paints"
  - "Text/Neutral/1/4"
  - "Text/Red/1"
  - "Border/Neutral/3"
  - "Motion/Overlay/180ms"
  - "Motion/Feedback/140ms / Motion/Region/220ms"
  - "Text/Neutral/3 / Text/Brand/1"
layoutConstraints:
  - "宽度由宿主提供；保留区域密度与窄屏布局。"
  - "桌面纯日期范围560px双月、纯日期单日320px、带时间380px单月；受视口约束，内容滚动区内保留4px焦点空间，操作区可达。"
  - "粗指针打开时选择bottom Sheet且打开期间不换壳；首轮单月，主要命中区至少44px，极小高度整体滚动兜底。"
compositionRules:
  - "清空用regular图标文字按钮；取消三级、确定一级。正常选择不显示可见步骤提示，真实错误只出现一次并关联受影响输入。"
  - "所有模式确认提交；关闭丢弃草稿，未变不重复提交。"
  - "宿主通过onValueChange持有已确认值并负责表单保存；首版不提供name/form或原生隐藏提交字段。"
  - "带时分按本地分钟比较；不带时间按本地日比较；空草稿时间为空，需明确填写；秒/毫秒不成为隐藏输入精度。"
  - "面板日期严格YYYY-MM-DD，合法完成后定位月份；非法文本保留，手动翻月不被未变化文本拉回。"
  - "纯日期范围宽屏双月/窄屏单月，普通输入聚焦不改变两点选择流程；显式日历按钮编辑一个端点后回到新范围。带时间始终单月，两行日期+时间，日历按钮明确选择端点。"
  - "清空移除日期、原始时间、组合状态及自定义时长；清空后取消恢复原值，可选字段确定提交null，required仍阻止空值。"
  - "时长区默认折叠；缺少起点只显示一处原因，各禁用按钮描述复用该原因；范围摘要仅显示次日和计算时长。"
  - "跨午夜必须完整结束日期或显式改为次日；按时长设置结束只计算一次，不锁定后续起点变化。"
  - "当前时间由宿主刷新minDate；保存时业务精确复核now。组件不自建时钟或固定学校时区转换。"
  - "窗口与答题时长分别保存；样板的统一关闭策略仅为本地演示。"
allowedModifications:
  - "宿主内容、className、既有variant；数据与保存由宿主拥有。"
restrictedModifications:
  - "不硬编码颜色或构建第二字段状态/浮层引擎。"
accessibility:
  - "每端一个HH:mm Input，日期用真实FormItem inside标签；端点日历按钮有可读名称与pressed状态。取消/确定/Escape恢复入口焦点，外点保留外部焦点。"
  - "不完整/无效/越界/跨禁用日期阻止确定；正常步骤中性，字段错误关联具体输入；触发器描述当前已确认值。"
  - "带时间键盘打开聚焦首个日期输入，纯日期优先选中日、无可选日聚焦标题；年月Select先关闭子层；输入Enter不提交外层表单，时间上下键有效值±1分钟且边界停止。"
  - "IME组合期间保留文本，暂停解析、跳月和确认；减少动态效果取消非必要动画。"
examples:
  - "#date-picker"
  - "#date-picker：date-time-homework / date-time-exam / date-time-cross-day"

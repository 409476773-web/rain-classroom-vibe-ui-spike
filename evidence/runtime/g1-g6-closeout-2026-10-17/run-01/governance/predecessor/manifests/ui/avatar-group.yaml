  - "members"
props:
  - "members: readonly {id,name,src?}[]"
  - "label: accessible strip/action name"
  - "size: 24 | 32 | 40; default 32"
  - "max: integer >=2; default 9; includes More"
  - "render: optional native whole-strip action; native props and ref target this strip"
  - "renderMember: optional rich remaining member content; host supplies explicit actions"
  - "className: outer layout only"

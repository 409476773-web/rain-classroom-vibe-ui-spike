  compactDefault: 24
  defaultDefault: 32
statuses:
  - "default"
  - "warning"
  - "error"
states:
  - "empty"
  - "filled"
  - "editing"
  - "focus-visible"
  - "read-only"
  - "disabled"
behavior:
  - "Manual range/precision errors retain raw input; no blur clamp or rounding."
  - "120 above max 100 decreases to 119; increase is disabled."
  - "Incomplete -, . and -. remain visible and block native submission. A trailing dot finishes on blur, Enter or native requestSubmit."
  - "Optional empty is null; required is owned by FormItem or the input prop."
  - "Decimal steps use exact digit arithmetic before safe number conversion."
  - "Controlled hosts own numbers; raw spelling is local to an edit session."
  - "Numeric feedback joins FormItem descriptions; business messages remain host-owned."
  - "No wheel changes, long press, scrub, locale formatting or high precision string mode."
  - "Stacked controls reserve space and appear on hover/focus; always shown on non-hover devices."
  - "Enabled clear action is hidden at rest and revealed only on field hover/focus; its reserved slot prevents value movement. Touch focuses the field before clearing."
accessibility:
  - "Native text input with spinbutton semantics and accessible name; named native buttons."
  - "ArrowUp/ArrowDown steps; native Tab and Enter; readonly remains selectable."
  - "Invalid current drafts block native validated submission; noValidate/form.submit bypass browser validation."
  - "Unit and numeric errors are associated descriptions; forced-color focus retained."
  - "Stacked arrows prioritize dense desktop fields; use split for larger touch targets."

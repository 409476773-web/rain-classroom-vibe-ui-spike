description: "数值填写、左右加减与传统右侧箭头；保留越界草稿，与 Input 共用三种字段外观。"
useWhen:
  - "数量、分值、百分比等需要数值校验与运算的字段。"
doNotUseWhen:
  - "手机号、学号和编号需要保留字符串身份；使用 Input。"
  - "任意精度十进制、货币/地区格式或科学计数输入；首版未支持。"
parts:
  - "root"
  - "frame"
  - "controls"
  - "decrease"
  - "value-region"
  - "control"
  - "prefix-text"
  - "clear-slot"
  - "clear-action"
  - "suffix-text"
  - "increase"
  - "message"
props:
  - "value/defaultValue: number|null; onValueChange; onValueCommit; onValidityChange"
  - "min/max optional; step positive defaults 1; precision optional 0–15"
  - "controls defaults true; clearable defaults false"
  - "controlsLayout: split (default) or stacked; shares one numeric state and validation"
  - "keyData defaults false; important values use Data font, bold 700 and tabular/lining numerals without changing size or line height; units/labels/placeholders keep UI typography"
  - "Intrinsic width: 5ch value region plus actual affixes and controls; stable while typing; fullWidth explicitly fills its parent"
  - "prefixText/suffixText; native input ref, name, form, label and descriptions"
variants:
  - "outlined"
  - "filled"
  - "underlined"
sizes:
  - 24
  - 28
  - 32
  - 36

description: "以可选标签表达少量筛选条件；完整组支持单选或多选、具名分组和宿主控制的选择状态。"
useWhen:
  - "需要平铺少量分类筛选条件或模式选项，标签的完整尺寸和视觉重量适合当前区域。"
  - "单选使用 mode=single，多选使用 mode=multiple；清空能力和业务生效范围由宿主决定。"
doNotUseWhen:
  - "静态身份或状态展示使用 Tag；导航和内容面板切换不因标签外形而使用选择组。"
  - "大量候选或长选项优先评估 Select；不在可选标签内部嵌套独立操作。"
states:
  - "default"
  - "hover and pressed for actions"
  - "focus-visible"
  - "disabled"
  - "checked for selection"
  - "removable for Tag and LinkTag"
tokens:
  - "Tag category colors preserve all 20 original profiles in Light and Dark; neutral and brand use established colors."
  - "Text, Icon, Border and Fill roles are distinct; Solid uses OnColor including neutral; neutral uses the existing Slate Solid background."
  - "20/24/28 heights; each selection target follows the full Tag bounds. Existing Space, Radius, Line, typography and shared Focus."
  - "Selection mark uses Icon Size 10/12/12 and registered Color Alpha 90 percent; source RGB and whole-component opacity stay separate. Forced colors inherit opaque system color."
  - "UI 700 is limited to the Tag Solid label; other labels use 400."
  - "Source multiply feedback 12/18 percent and whole disabled opacity 0.3 remain measured compound paints."
sizes:
  - "20: font 12/14, padding 6, radius 4; 24: font 13/18, padding 8, radius 6; 28: font 13/18, padding 12, radius 6."
  - "Static compact default 20; other defaults 24; explicit size wins. Half Space/6 reserves separate transparent desktop action targets around each Tag. Coarse pointers extend vertically with Space/14 and matching row space, retaining at least 24px width and 44px height."
  - "Vertical complete frames are 18x36 / 22x40 / 26x44, with intrinsic growth for longer text."
allowedModifications:
  - "Choose the complete recipe, registered color, appearance and size."
  - "Use layout className or named Local Recipe for declared Parts."
restrictedModifications:
  - "No raw colors, private tokens, arbitrary visual values, new dependencies or arbitrary profile strings."
  - "Do not combine navigation or close actions inside a selectable input label."
  - "Do not infer business status from color or implement TagSelect and tag creation in this batch."
accessibility:
  - "Visible text remains the full accessible label when visually truncated; the host provides a keyboard and touch route to long content."
  - "Native controls preserve keyboard semantics, form values and disabled behavior."
  - "Shared focus stays distinct from selection; forced colors preserve boundaries, marks and actions."
  - "Removal emits intent only; the owner transfers focus, reports results and restores failed removals."

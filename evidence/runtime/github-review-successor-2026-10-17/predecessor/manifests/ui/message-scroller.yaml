description: "保留锚点和阅读位置的会话滚动容器。"
useWhen:
  - "会话流式增长需要保留自由阅读、turn锚点和回到最新入口。"
  - "需要前插历史保位、稳定ID跳转与可见性订阅。"
doNotUseWhen:
  - "另写scrollIntoView/use-stick-to-bottom控制器或先自行虚拟化移除DOM。"
  - "逐tokenlive通知、每条都scrollAnchor或业务请求交给Provider。"
anatomy:
  - "provider"
  - "root"
  - "viewport"
  - "content"
  - "item"
  - "button"
parts:
  - "provider"
  - "root"
  - "viewport"
  - "content"
  - "item"
  - "button"
props:
  - "Provider完整0.3.1 Props：autoScroll=false；defaultScrollPosition=end(start/end/last-anchor)；scrollEdgeThreshold=8、scrollPreviousItemPeek=64、scrollMargin=0。"
  - "Root/Viewport/Content/Item保留原生div Props/ref；只有Button支持render。Viewport preserveScrollOnPrepend=true，Content另有spacerClassName。Item messageId在类型中可选，但未给时不注册ID，scrollAnchor=false；需要跳转/visibility/历史保位时显式给稳定messageId。"
  - "Button direction=end(start/end)、behavior=smooth，size/variant为house外观类型，render/localRecipe/ref/onClick可组合。"
  - "公开useMessageScroller/useMessageScrollerScrollable/useMessageScrollerVisibility；命令scrollToStart/End/Message返回boolean。"
  - "scrollToMessage支持align/scrollMargin/behavior；Start/End0.3.1只消费behavior；挂载后缺失ID返回false。"
slots:
  - "MessageScrollerProvider"
  - "MessageScroller"
  - "MessageScrollerViewport"
  - "MessageScrollerContent"
  - "MessageScrollerItem"
  - "MessageScrollerButton"
  - "useMessageScroller"
  - "useMessageScrollerScrollable"
  - "useMessageScrollerVisibility"
variants:
  - "首尾跳转和锚点/自由阅读由原引擎策略；不添加平行selected/scroll状态。"
states:
  - "pending-scroll、autoscrolling和button data-active=true/false；inactive inert/tabIndex=-1。"
  - "scrollable start/end表示仍能向该端滚动；visibility按订阅启用。"
dependencies:
  - "React19.2.8与Rain Foundations；rainCn依赖既有tailwind-merge3.6.0。"
  - "@shadcn/react0.3.1/message-scroller"
  - "本项实际源码/内部helper/被动视觉依赖在Registry登记；消费仍为managed @rain-next/ui。"
tokens:
  - "内容gap24、按钮上下16、薄scrollbar/gutter、intrinsic auto10rem。"
  - "按钮既有Button recipe + Background/Neutral/1/Text/Neutral/1/Border/Neutral/3；hover中性填充。"
  - "shared fade底边min(12%,40px)/尾96px、enter200/exit400ms为局部来源，未新增全局Token。"
layoutConstraints:
  - "宿主给明确高度；viewport真实overflow-y-auto与min-height0，content min-height100%。"
  - "Item保持DOM/content-visibility，messageId稳定唯一；fade增强须检查最后一行/按钮。"
compositionRules:
  - "宿主拥有waiting/streaming/completed/error与history数据；Provider仅滚动策略。"
  - "Root/Part recipe隔离；0.3.1外部Root ref会覆盖镜像状态ref，读状态用公开hook或Viewport ref。"
allowedModifications:
  - "使用本条列出的真实Props/ref/className/style；仅source已提供的Parts支持render/localRecipe，不把通用模板当API。"
  - "视觉用既有Rain Token/具名局部方案；已登记源几何/动效差额不升级全局Foundation。"
restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "Viewport默认命名region/tabIndex0，Content为log/additions；宿主streaming时aria-busy避免逐token通知。"
  - "Button先caller事件，preventDefault取消且不blur；aria-disabled阻止click/Enter/Space但可聚焦。"
  - "reduce在激活时将smooth转auto并保留单次blur，显式非smooth行为保持。"

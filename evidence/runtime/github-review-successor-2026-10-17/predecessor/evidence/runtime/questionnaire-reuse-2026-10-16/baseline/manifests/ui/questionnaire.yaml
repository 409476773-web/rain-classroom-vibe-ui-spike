props:
  - "Root完整Primitive.Root Props：items/item/defaultItem/onItemChange/shortcuts、noValidate/action/onSubmit/onReset及原生form/ref。"
  - "Item name/required/multiple/disabled/invalid/onStatusChange；Choice value/checked/defaultChecked/onChange/disabled。"
  - "Input保留原生类型/约束/value/defaultValue/onChange/ref/render；单选Choice与freeform按引擎互斥，多选按引擎组合。"
  - "Progress children/ARIA/render(state current,total,first,last)/ref保留，默认中文可见与aria-valuetext。"
  - "保留15styled Parts；Progress/Title/Description/Choices/Choice/Input/Error/四动作支持source render，Root/Item为原生form/fieldset，Actions/ChoiceDescription为原生div/span。四动作variant/size是house Button外观类型，业务loading可由render的真实Button表达。"
  - "QuestionnaireRecipe root及子Part局改；没有问卷SDK/评分/持久化/自动前进新API。"
slots:
  - "Questionnaire"
  - "QuestionnaireProgress"
  - "QuestionnaireItem"
  - "QuestionnaireTitle"
  - "QuestionnaireDescription"
  - "QuestionnaireChoices"
  - "QuestionnaireChoice"
  - "QuestionnaireChoiceDescription"
  - "QuestionnaireInput"
  - "QuestionnaireError"

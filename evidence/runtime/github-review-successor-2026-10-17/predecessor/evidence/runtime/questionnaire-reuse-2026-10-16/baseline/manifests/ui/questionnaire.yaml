  - "QuestionnaireSkip"
  - "QuestionnaireNext"
  - "QuestionnaireSubmit"
variants:
  - "单选/多选/freeform/shortcuts letters或numbers；没有通用Questionnaire variant/size。"
states:
  - "unanswered/answered/skipped/invalid/disabled/active；boolean data属性为存在/不存在。"
  - "inactive题/动作hidden/inert；Next先当前校验，Submit所有启用题；disabled题不计total。"
dependencies:
  - "React19.2.8与Rain Foundations；rainCn依赖既有tailwind-merge3.6.0。"
  - "@shadcn/react0.3.1/questionnaire + Base UI useRender1.8.0"
  - "本项实际源码/内部helper/被动视觉依赖在Registry登记；消费仍为managed @rain-next/ui。"
tokens:
  - "Root/item gap16、Choices8、Choice gap10与padding10×12、Radius10。"
  - "Text/Neutral1/2/3、中性表面/边界，selected品牌浅底/边界，error Red与实际Focus。"
  - "复用RadioIndicator18与CheckboxIndicator16/24canvas；shortcut UI12/20替换source10px mono。"
layoutConstraints:
  - "Root原生form，Item fieldset，Title legend；Choices为grid，四动作三列固定位置。"
  - "内部ChoiceInput/Label/Shortcut只一套原生控制；hidden规则保护不被display utility覆盖。"
compositionRules:
  - "FormData单值get/多值getAll；skip没有字段，onStatusChange区分主动跳过。"
  - "末题Skip在0.3.1会requestSubmit；宿主示例必须一致处理完成，不等待第二次Submit。"
  - "宿主拥有条件定义/恢复草稿/提交mock与失败保留；不在组件默认localStorage。"
allowedModifications:
  - "使用本条列出的真实Props/ref/className/style；仅source已提供的Parts支持render/localRecipe，不把通用模板当API。"
  - "视觉用既有Rain Token/具名局部方案；已登记源几何/动效差额不升级全局Foundation。"
restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "校验失败停/打开无效题并聚焦答案，成功前进聚焦fieldset；Error当前无效role=alert。"
  - "标题/说明关联保留；自定义Title显式id/aria-labelledby，装饰indicator隐藏。"
  - "IME isComposing/keyCode229不前进；文本不抢字母/箭头；字母/数字只选择不自动下一题。"
  - "导航aria-disabled阻挡激活、保留焦点；caller.preventDefault阻止primitive导航/原生提交。"
examples:
  - "apps/playground/src/docs/components/g6-conversation-pages.tsx"
recipes:
  - "默认与有名局改只作用该实例；原生组合接缝及未改兄弟需保持。"
antiPatterns:
  - "考试评分/题库/分支规则编辑器或另建answer store。"
  - "内嵌完整RadioCard/CheckboxCard造成双input/双label；使用现有被动indicator。"

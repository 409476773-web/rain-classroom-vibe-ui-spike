  scope: "feature-root-only"
  globalRootAllowed: false
  automaticPromotion: false

cssExceptions:
  requiredFields:
    - "id"
    - "component"
    - "selector"
    - "reason"
    - "tokens"
    - "tests"
    - "status"
  entries:
    - id: "g4-components-owned-parts"
      component: "g4-components"
      selector: ".rain-item owned Parts; .rain-progress owned Parts; .g4-* documentation layout"
      reason: "Owned Parts keep image fitting, focus, state feedback, density, indeterminate shape, reduced motion and forced colors; documentation uses a scoped responsive layout."
      tokens:
        - "--rain-space-4"
        - "--rain-space-6"
        - "--rain-space-8"
        - "--rain-space-20"
        - "--rain-focus-item"
        - "--rain-motion-feedback-duration"
      tests:
        - "packages/ui/src/item/item.test.tsx"
        - "packages/ui/src/progress/progress.test.tsx"
        - "apps/playground/src/docs/components/g4-component-pages.test.tsx"
        - "scripts/g4-components-governance.test.ts"
      status: "implemented-g4-candidates-awaiting-human"
    - id: "input-number-parts"
      component: "ui-input-number"
      selector: ".rain-input-number and owned parts"
      reason: "Split and Classic stacked controls reuse shared Input frame tokens; intrinsic width uses a stable 5ch value plus actual affixes and controls, fullWidth opt-in. keyData uses existing Data font/bold/numeric tokens only on the value, preserving field size and line height."
      tokens:
        - "--rain-font-data"
        - "--rain-font-weight-bold"
        - "--rain-font-numeric-data"
        - "--rain-input-height-32"
        - "--rain-font-size-14"
        - "--rain-category-border-neutral-3"
        - "--rain-category-background-neutral-1"
        - "--rain-category-icon-neutral-2"
        - "--rain-space-8"
      tests:
        - "packages/ui/src/input-number/input-number.test.tsx"
        - "tests/e2e/input-number.spec.ts"
      status: "implemented-input-number-candidate"
    - id: "input-number-focus"
      component: "ui-input-number"
      selector: ".rain-input-number nested focus and forced colors"
      reason: "Nested control needs the existing field focus policy and system-color fallback."
      tokens:
        - "--rain-input-height-32"
        - "--rain-font-size-14"
        - "--rain-category-border-neutral-3"
        - "--rain-category-background-neutral-1"
        - "--rain-category-icon-neutral-2"
        - "--rain-space-8"
      tests:
        - "packages/ui/src/input-number/input-number.test.tsx"
        - "tests/e2e/input-number.spec.ts"
      status: "implemented-input-number-candidate"
    - id: "input-number-page-layout"
      component: "ui-input-number"
      selector: ".number-page and owned parts"
      reason: "Local responsive review layout; 1200px maximum, 900px and 600px breakpoints."
      tokens:
        - "--rain-input-height-32"
        - "--rain-font-size-14"
        - "--rain-category-border-neutral-3"
        - "--rain-category-background-neutral-1"
        - "--rain-category-icon-neutral-2"
        - "--rain-space-8"
      tests:
        - "packages/ui/src/input-number/input-number.test.tsx"
        - "tests/e2e/input-number.spec.ts"
      status: "implemented-input-number-candidate"
    - id: "avatar-geometry"
      component: "ui-avatar"
      selector: ".rain-avatar, .rain-avatar-group, .rain-avatar-grid and owned parts"
      reason: "24/32/40 portraits; overlap 10/12/16; 40px grid and exact 1–9 arrangements; no outer layout ownership."

    - id: "empty-presentation"
      component: "ui-empty"
      selector: ".rain-empty and its owned parts; theme boundaries set only two local image display switches"
      reason: "Keep original artwork proportions, nearest-theme image selection, optional-part spacing and wrapping; no business state or global Token changes."

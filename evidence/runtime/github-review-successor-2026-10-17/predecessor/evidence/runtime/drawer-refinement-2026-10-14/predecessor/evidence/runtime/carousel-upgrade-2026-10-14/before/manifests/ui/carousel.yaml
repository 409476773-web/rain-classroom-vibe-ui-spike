sourceVersion: "shadcn-ui/ui@3ba91b1cc83e1bbe4ab35a422ff2a694849c5048; rain-adaptation-2026-10-14"
description: "由Embla维护拖动和当前位置的手动轮播。"
useWhen:
  - "课程素材需要手动单图/多卡轨道、拖动与前后导航。"
  - "需要横向或纵向布局、方向上下文和Embla已有Options/API。"
doNotUseWhen:
  - "增加自制selectedIndex/定时切片或第二transform动画。"
  - "仅装autoplay插件但没有暂停/恢复、聚焦/悬停停止合同。"
anatomy:
  - "root"
  - "content"
  - "item"
  - "previous"
  - "next"
parts:
  - "root"
  - "content"
  - "item"
  - "previous"
  - "next"
props:
  - "Carousel原生div Props/ref + opts/plugins/setApi/orientation(horizontal默认|vertical)，公开CarouselApi/Options/Plugin及useCarousel。"
  - "方向优先opts.direction→明确dir→Base UI context；orientation优先于opts.axis。"
  - "Content className/style/ref作用inner flex容器；viewport ref由内部Embla拥有。"
  - "Previous/Next采用合法Rain Button Props和ref，children可选；默认真实IconButton32/16，显式variant/size/children等转house Button。"
slots:
  - "Carousel"
  - "CarouselContent"
  - "CarouselItem"
  - "CarouselPrevious"
  - "CarouselNext"
  - "useCarousel"
variants:
  - "水平/纵向、单页/多项/RTL；loop等Options由Embla消费。"
states:
  - "select/reInit/edge availability由实际API决定；调用方disabled、aria-disabled/loading和边缘合并。"
dependencies:
  - "React19.2.8与Rain Foundations；rainCn依赖既有tailwind-merge3.6.0。"
  - "embla-carousel-react8.5.2（传递core/reactive-utils同版）"
  - "本项实际源码/内部helper/被动视觉依赖在Registry登记；消费仍为managed @rain-next/ui。"
tokens:
  - "布局Space16、来源外置48px；默认导航为IconButton32/16 + Radius/full具名recipe。"
  - "导航paint/Focus沿Button/IconButton，方向glyph采用现有Arrow Left/Right/Up/Down。"
layoutConstraints:
  - "宿主保留外置按钮空间，窄屏可改为static行；默认absolute通过rainCn保护且调用方仍可覆盖。"
  - "纵向需明确轨道高度；logical margin/padding/控制位置，Embla独占transform。"
compositionRules:
  - "调用方事件先执行，preventDefault阻止导航；边缘不能被disabled=false重新启用。"
  - "不无条件inert/aria-hide离屏交互内容，Embla watchFocus把聚焦项带入视野。"
allowedModifications:
  - "使用本条列出的真实Props/ref/className/style；仅source已提供的Parts支持render/localRecipe，不把通用模板当API。"
  - "视觉用既有Rain Token/具名局部方案；已登记源几何/动效差额不升级全局Foundation。"
restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "region与slide具体名称由宿主给；root有明确键盘入口时接管轴向箭头，子输入/OTP/Slider保留自己的键盘。"
  - "Inactive/边缘控件沿真实Button禁用语义；位置播报来自真实API，不按动画帧发送。"
  - "reduce通过Embla断点duration0；不把物理duration当毫秒。"
examples:
  - "apps/playground/src/docs/components/g6-interaction-pages.tsx"
recipes:
  - "Root/Content/Item用className/style；默认导航的内部IconButton具名recipe只绑定该实例，未暴露Carousel localRecipe属性。"
antiPatterns:
  - "增加自制selectedIndex/定时切片或第二transform动画。"
  - "仅装autoplay插件但没有暂停/恢复、聚焦/悬停停止合同。"

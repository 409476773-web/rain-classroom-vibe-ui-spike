    - "next"
  redesignedTraits:
    - "修source捕获后代左右键/纵向轴问题、select/reInit对称清理与末尾props覆盖onClick/disabled。"
    - "ghost/icon-sm等不存在于house的方案不透传；logical位置及图标方向与实际引擎一致。"
  intentionallyNotInherited:

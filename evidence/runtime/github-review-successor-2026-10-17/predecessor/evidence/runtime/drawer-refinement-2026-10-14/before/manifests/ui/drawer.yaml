props:
  - "DrawerRootProps=BaseDrawer.Root.Props + showSwipeHandle?:boolean(默认false)；modal默认true，swipeDirection默认down。"
  - "保留open/defaultOpen/onOpenChange/onOpenChangeComplete、disablePointerDismissal、actionsRef、handle/triggerId/defaultTriggerId及snapPoints/snapPoint/defaultSnapPoint/onSnapPointChange/snapToSequentialPoints。"
  - "Content为BaseDrawer.Popup.Props，含ref/render/initialFocus/finalFocus及className/style状态函数。"
  - "Portal保留container/keepMounted；Overlay为Backdrop Props；Trigger/Close保留原生按钮/render/ref/事件，Title/Description由原引擎关联。"
  - "Header/Footer/SwipeHandle为原生div属性；SwipeHandle装饰aria-hidden。"
slots:
  - "Drawer"
  - "DrawerPortal"
  - "DrawerOverlay"
  - "DrawerSwipeHandle"
  - "DrawerTrigger"
  - "DrawerClose"
  - "DrawerContent"
  - "DrawerHeader"
  - "DrawerFooter"
  - "DrawerTitle"
  - "DrawerDescription"
variants:
  - "down/up/left/right；modal=true/false/trap-focus；纵向snap与嵌套沿原引擎。"
states:
  - "starting/ending/swiping/nested-open/nested-swiping与snap offset/释放强度由Base UI拥有。"
dependencies:
  - "React19.2.8与Rain Foundations；rainCn依赖既有tailwind-merge3.6.0。"
  - "本项实际源码/内部helper/被动视觉依赖在Registry登记；消费仍为managed @rain-next/ui。"
tokens:
  - "Background/Neutral/1、Text/Neutral/1/2/3、Border/Neutral/3、Radius12；Header/Footer Space16，gap2/8。"
  - "Overlay采用已有rain-overlay-focus，与modal独立；handle为中性填充及全圆角。"
  - "Popup/Overlay z31/30桥接已有浮层体系；原450/400/200/300ms和手势stack参数为局部来源几何。"
layoutConstraints:
  - "Content内部Portal→可选Overlay→Viewport→Popup→Base Content；宿主体区min-h-0独立滚动。"
  - "纵向最大100dvh−6rem；snap按来源视口高度；侧向75%，≥640px为24rem。"
  - "Handle96×4或4×96，外容器12；nested peek16/bleed48/scale-step.05。"
compositionRules:
  - "未保存关闭由onOpenChange的details.cancel()拦截，宿主决定保存/放弃；组件不新增dirty Props。"
  - "横向Carousel可沿引擎data-base-ui-swipe-ignore=x仲裁；输入场景按需组合现有VirtualKeyboardProvider。"
  - "iOS绝对定位backdrop需要宿主body position:relative；Footer带safe-area。"
allowedModifications:
  - "使用本条列出的真实Props/ref/className/style；仅source已提供的Parts支持render/localRecipe，不把通用模板当API。"
  - "视觉用既有Rain Token/具名局部方案；已登记源几何/动效差额不升级全局Foundation。"
restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "Title/Description形成原生dialog名称和描述；焦点交Base UI，关闭回正确Trigger。"
  - "提供键盘Close/吸附按钮，不把装饰Handle伪装Slider；三种modal语义分别保持。"
  - "非模态Popup明确pointer-events:auto；reduce禁非必要进出/回弹过渡，保留即时手势。"
examples:
  - "apps/playground/src/docs/components/g6-interaction-pages.tsx"
recipes:
  - "通过真实Popup className/style状态函数与宿主样式组合具名局改；没有localRecipe属性。"
antiPatterns:
  - "用既有Sheet别名伪装为有手势跟随的Drawer。"
  - "公共组件直接管理草稿、保存网络或dirty业务状态。"

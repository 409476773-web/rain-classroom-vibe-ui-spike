useWhen:
  - "少量互斥类别占同一个总量的比例。"
doNotUseWhen:
  - "多个独立目标进度；类别重叠；以零总量生成100%。"
anatomy:
  - "宿主标题/单位、原生图形、精确读数/数据表。"
parts:
  - "PieChart"
  - "PieSlice"
  - "PieCenter"
  - "ChartLegend"
props:
  - "局部mini配方为compact32 / comfortable56、hoverOffset=1；饼/环饼复用同一入口，保持无悬浮光晕。"
  - "PieData[]为label/value/color?；value有限非负，分母为全部类别之和。"
  - "innerRadius=0为饼形、正值为环饼；PieSlice逐index渲染；hoveredIndex/onHoverChange可受控。"
slots:
  - "原生children/提示render回调；宿主布局、业务筛选及数据表。"

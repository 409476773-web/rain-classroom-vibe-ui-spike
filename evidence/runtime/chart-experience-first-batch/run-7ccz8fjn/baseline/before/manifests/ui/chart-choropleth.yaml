description: "地区强度、稳定ID激活与局部取景；世界默认图及App私有中国省市配方分别提供许可明确的真实边界和Mock统计。"
useWhen:
  - "已有许可明确的GeoJSON地区边界，需比较地区值或强度。"
doNotUseWhen:
  - "用演示数值做真实地区判断；缺值填0；未提供地理数据。"
anatomy:
  - "宿主标题/单位、原生图形、精确读数/数据表。"
parts:
  - "ChoroplethChart"
  - "ChoroplethFeatureComponent"
  - "ChoroplethTooltip"
  - "宿主同源色条"
props:
  - "fitToData默认false；设true按当前真实geometry取景。切层由宿主更新data与key并清理提示/视图。"
  - "Feature可选onFeatureActivate(id, feature)与selectedFeatureId；properties.id优先，不能使用数组下标代替稳定身份。"
  - "data为GeoJSON FeatureCollection；properties.id稳定唯一，值按id关联。"
  - "ChoroplethFeatureComponent为渲染组件，ChoroplethFeature是数据类型；getFeatureColor和tooltip内容由宿主供给，center/margin按几何调整。"
slots:
  - "原生children/提示render回调；宿主布局、业务筛选及数据表。"
variants:
  - "默认世界分区强度；可选缩放与按实际geometry取景。"
states:
  - "正常、悬停/焦点、更新/重播；动效/减少动效分别检查。"
  - "有效0使用最浅色，缺值使用chart-no-data；未匹配地区不默认0。"
  - "空/无效状态由宿主先校验并说明，非通用数据适配器。"
dependencies:
  - "React/React DOM、Rain Foundations；实际固定npm及类型依赖见registry/charts.json。"
tokens:
  - "Rain表面、文字、网格、提示、指示器和Focus角色，公共规则见packages/ui/src/charts/README.md。"
  - "P05五级顺序色，示例0—100；图形/色条/提示同一映射。"
layoutConstraints:
  - "默认世界示例按16:9自适应，最大宽960px、底部色条；其他几何需核对投影及尺寸。"
  - ".rain-chart为独立样式作用域，需可测量尺寸；不依赖实验页祖先或全局Bklit reset。"
compositionRules:
  - "稳定地区id和值明确关联；有限值与无数据区分；默认及变体共用177个Natural Earth世界地区，数值为演示数据。"
  - "保留Bklit原生Parts与默认展示强度；数据/单位/分母与色标、提示和表值一致。"
allowedModifications:
  - "通过原生Props/Parts选择已列配方、尺寸、标签、单位及受控状态；宿主拥有数据校验。"
restrictedModifications:
  - "不改全局Token、品牌主蓝或偷偷扩大到未支持数据合同；不从vendor私有路径绕过公共入口。"
accessibility:
  - "SVG保持aria-hidden；中国配方提供同等地区Button列表、Enter/空格、面包屑与精确Table。拖动与轻触由原生zoom手势区分。"
  - "宿主提供标题、单位、文本状态和精确数据表；图例可用renderItem接入button焦点。"
  - "原生hover不代表所有点键盘可达；真实读屏/物理触屏/完整对比度未登记通过。"

  - "局部MiniSize完整环32 / 64，底部开口弧40×30 / 72×54；225°圆形轨道；紧凑外置读数，舒展中心显示value/maxValue百分比与短说明，文字放大可外置。"
  - "MiniSize属于可下载局部配方，不是公共图表size枚举；尺寸事实源为chart-business/mini-layout.ts。"
  - "每环value/maxValue，单位和目标可不同；不使用原生totalValue作为业务合计。"
  - "保留Bklit原生Parts与默认展示强度；数据/单位/分母与色标、提示和表值一致。"
allowedModifications:
  - "通过原生Props/Parts选择已列配方、尺寸、标签、单位及受控状态；宿主拥有数据校验。"
restrictedModifications:
  - "不改全局Token、品牌主蓝或偷偷扩大到未支持数据合同；不从vendor私有路径绕过公共入口。"

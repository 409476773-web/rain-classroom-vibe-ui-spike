<!doctype html>
<html lang="zh-CN" data-rain-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习单元概览</title><link rel="stylesheet" href="rain.css"><link rel="stylesheet" href="fixture.css"></head><body><main data-asset-identity="local-experiment"><h1>学习单元概览</h1><p class="intro">查看各单元的内容与学习安排。以下为本地演示内容。</p><section class="panel" aria-labelledby="units-heading"><div class="panel-heading"><h2 id="units-heading">本阶段内容</h2><span class="small">3 个单元</span></div><div class="units">
<article class="unit" data-probe="unit1"><div><h3 data-probe="unit-title1">理解课堂观察</h3><p class="unit-summary" data-probe="unit-summary1">从一段真实课堂记录出发，分辨观察事实、个人判断和后续问题，建立可以持续使用的记录方式。</p><p class="small unit-meta">阅读材料 2 份 · 建议学习 30 分钟</p></div><span class="unit-status">已完成</span></article>
<article class="unit" data-probe="unit2"><div><h3 data-probe="unit-title2">练习记录与反馈</h3><p class="unit-summary" data-probe="unit-summary2">完成一次观察记录，并回应同伴的一个问题。</p><p class="small unit-meta">练习 1 项 · 建议学习 20 分钟</p></div><span class="unit-status status-current">进行中</span></article>
<article class="unit" data-probe="unit3"><div><h3 data-probe="unit-title3">形成课程改进方案</h3><p class="unit-summary" data-probe="unit-summary3">综合前两个单元的记录与反馈，选取一个具体课堂问题，说明改进目标、采用的方法和需要继续观察的结果。方案可以简短，但应保留事实依据。</p><p class="small unit-meta">提交说明 1 份 · 建议学习 45 分钟</p></div><span class="unit-status">待开始</span></article>
</div></section></main></body></html>

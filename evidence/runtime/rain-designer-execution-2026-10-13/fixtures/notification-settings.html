<!doctype html>
<html lang="zh-CN" data-rain-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知设置</title><link rel="stylesheet" href="rain.css"><link rel="stylesheet" href="fixture.css"></head><body><main data-asset-identity="local-experiment"><h1>通知设置</h1><p class="intro">为课程通知维护接收信息。以下为本地演示内容。</p><section class="panel" aria-labelledby="form-heading"><h2 id="form-heading">接收信息</h2><form class="settings">
<div class="field-row"><label for="recipient">接收者名称</label><div><input id="recipient" value="课程助教" readonly></div></div>
<div class="field-row" data-probe="email-row"><label for="email">通知邮箱</label><div><input id="email" data-probe="email-input" value="teaching-team@" aria-invalid="true" aria-describedby="email-feedback" readonly></div></div>
<div class="field-row" data-probe="phone-row"><label for="phone">联系电话</label><div><input id="phone" data-probe="phone-input" value="010-0000-0000" readonly><p id="email-feedback" class="field-message" data-probe="email-feedback">请输入完整的邮箱地址。</p></div></div>
<div class="field-row"><label for="note">接收备注</label><div><textarea id="note" rows="2" readonly>课程更新与讨论资料统一发送给助教，由助教转达。</textarea><p class="field-note">备注只用于本课程的通知安排。</p></div></div>
</form></section></main></body></html>

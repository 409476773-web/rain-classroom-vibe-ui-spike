id: "layout-connected-surface"
name: "ConnectedSurface"
description: "唯一 SVG 联合轮廓连接当前页签与工作面；纯几何、实例测量与局部裁切。"
useWhen:
  - "当前语义页签与面板需要批准 browser 肩部、inset 安全内衬或 merged 贴边连接。"
doNotUseWhen:
  - "只需要 A1 下划线或独立筛选组。"
  - "需要让布局管理学生、文件、班级或编辑草稿。"
anatomy:
  - "frame"
  - "row/semantic track slot"
  - "decorative shape layer"
  - "panel slot"
parts:
  - "frame"
  - "row"
  - "layer"
  - "union"
  - "panel"
props:
  - "instanceId: string 必填；activeKey?: string | number | null，用于受控选择后的重测。"
  - "connection?: inset | merged，默认 inset；surfaceMode?: tonal | plain | outlined，默认 tonal。"
  - "geometry?: { panelRadius?: 0|6|8|10|12; tabRadius?: 0|4|6|8|10|12; shoulder?: 4|6|8; trackInset?: 0|8|16|20|24|28|32 }。"
  - "track: ReactNode; children: ReactNode；其他原生 div 属性/className/style。没有 contour 选择和业务状态 API。"
slots:
  - "track accepts Tabs.Nav; native controls may declare data-connected-viewport and data-connected-active=true."
  - "children is the content/layout slot; callers own semantic panels and internal scrolling."
variants:
  - "inset / merged"
  - "tonal / plain / outlined; browser contour only."
states:
  - "active-visible"
  - "active-clipped"
  - "zero-size-fallback"
  - "restored"
  - "resized"
  - "scrolled"
dependencies:
  - "React"
  - "@rain-next/foundations existing CompositionSpaceTokenName"
  - "Native SVG, ResizeObserver, MutationObserver and requestAnimationFrame"
tokens:
  - "Existing Rain geometry keys; local guard=2 CSS px is a construction constraint, not a global spacing Token."
  - "--rain-local-cs-panel-radius/tab-radius/shoulder/safe-inset; local navigation surface/track/outline with existing semantic fallbacks."
layoutConstraints:
  - "inset minimumInset = panelRadius + shoulder + 2; resolvedInset=max(requested,minimum). merged resolves inset to 0."
  - "Frame-local CSS px measurement accounts for parent scaling; shape path remains one closed union."
  - "A fully clipped/current partially outside viewport paints only the panel, matching the reference."
  - "Host determines overall height; panel/content scrollports must have finite remaining height."
compositionRules:
  - "Each instance owns its refs/observer lifecycle and has a distinct instanceId."
  - "Interactive controls stay in semantic HTML; SVG is aria-hidden, pointer-events:none."
  - "Do not add a second panel top outline, CSS shoulder or trigger fill competing with the union."
accessibility:
  - "Creates no extra focus stop or tab semantics."
  - "Focus remains on the HTML trigger; outlined mode top marker belongs to the navigation trigger."
antiPatterns:
  - "Global document queries for active tabs."
  - "Resetting all panel corners or setting global overflow:visible."
  - "Passing business models into the geometry engine."
relatedComponents:
  - "ui-navigation-tabs"
  - "ui-scope-navigation"
  - "layout-split"
stateOwner: "Caller owns active identity/content; component owns derived geometry only."
restoreOwner: "Caller selection layer; geometry does not move business focus."
boundaryOwner: "ConnectedSurface owns union contour/seam; inset preserves panel outer corners; merged delegates frame edge closure."

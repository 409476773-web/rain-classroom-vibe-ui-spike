id: "ui-navigation-tabs"
name: "NavigationTabs"
description: "A1 内容分区与 A4 双行身份页签，显式复用既有 Tabs 行为。"
useWhen:
  - "同一对象的相关内容面板，需要批准稿的名称指示线或 browser 页签外观。"
doNotUseWhen:
  - "路由目的地、提交操作、图表模式或单纯筛选状态。"

  - "@rain-next/foundations"
  - "DropdownMenu/Tooltip infrastructure already used by Tabs"
tokens:
  - "Local --rain-local-navigation-* candidates and existing brand marker Token."
  - "Connected geometry is inherited from the host --rain-local-cs-* values, not a duplicate contour."
layoutConstraints:
  - "Browser items have 8px gaps; both connections keep the same 8px track top inset and content geometry. Hover paint stops 8px before the panel without changing the hit area."
  - "Top position only; existing bottom/vertical consumers stay on unchanged Tabs."
  - "Browser two-line identity items use 224px sample width; ScopeNavigation owns its separate adaptive width allocation."
  - "ConnectedSurface must be supplied for a shared browser tab/panel union."
compositionRules:
  - "Keep one Nav and one Panels inside the same Root."
  - "Default activation remains manual; arrow focus does not silently change the panel."
  - "Use renderSurface to compose a Layout; UI does not import Layout."
  - "Navigation counts show the raw display value without the legacy Tabs parentheses; old Tabs formatting remains unchanged."
accessibility:
  - "Existing Tabs tablist/tab/tabpanel ARIA relation, keyboard and disabled semantics."
  - "One focus owner per trigger; decorative shape remains aria-hidden and pointer-transparent."
  - "Description supplements the visual label without replacing its plain accessible name."
antiPatterns:
  - "Applying the browser shape to a radiogroup or link bar."
  - "Hand-copying a second selected-tab outline inside the trigger."
relatedComponents:
  - "ui-tabs"
  - "ui-navigation-bar"
  - "ui-scope-navigation"
  - "layout-connected-surface"
stateOwner: "Existing Tabs controlled application value or Tabs uncontrolled state."
restoreOwner: "Tabs owns trigger/panel keyboard focus; caller owns route changes."
boundaryOwner: "Label marker/short separators in navigation; union surface exclusively ConnectedSurface."

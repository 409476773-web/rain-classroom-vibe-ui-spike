props:
  - "Existing Tabs items/value/defaultValue/onValueChange/activationMode/panelMount/size/overflow protocol; only position=top."
  - "visualPreset: navigation-line | navigation-browser; default navigation-line. Browser defaults overflow=scroll."
  - "TabsItem.description?: string is a separate identity line shown only in browser preset; label remains a required plain string."
  - "renderSurface?({ track, panels }): ReactNode; also supports NavigationTabs.Root/Nav/Panels."
slots:
  - "item.leadingIcon and item.content; extraStart/extraEnd; renderSurface injects ConnectedSurface from a higher layer."
variants:
  - "navigation-line"
  - "navigation-browser"

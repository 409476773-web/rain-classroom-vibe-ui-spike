id: "ui-scope-navigation"
name: "ScopeNavigation"
description: "公共资源包与教学班的双行范围选择，完整班级搜索与当前末槽策略。"
useWhen:
  - "同一课程包含公共范围及大量教学班，需要稳定范围身份与共享编辑区。"
doNotUseWhen:
  - "浏览器文档关闭/新建、路由历史、普通单字段选择或单纯状态筛选。"
anatomy:
  - "scope root"
  - "visible range strip"
  - "More trigger with hidden-class count"
  - "anchored searchable Popover"
  - "stable shared content panel"
parts:
  - "root"
  - "nav"
  - "list"
  - "tab"
  - "label"
  - "description"
  - "extra-end"
  - "panel"
  - "scope-dropdown"
  - "scope-search"
  - "scope-results"
props:
  - "items: readonly { id: string; label: string; description?: string; icon?: ReactNode; disabled?: boolean }[]；第一个项目是公共范围。"
  - "value: string | null; onValueChange(id: string); visibleLimit?: 3 | 4 | 5, default 4."
  - "children?: ReactNode; renderSurface?({track,panels}); aria-label?; className?; loading?: boolean; error?: string."
slots:
  - "children: same shared editor instance for valid scope changes; renderSurface: host ConnectedSurface; item.icon."
variants:
  - "browser two-line identity strip; finite visibleLimit 3/4/5."
states:
  - "current"
  - "disabled"
  - "loading"
  - "error"
  - "empty"
  - "missing-current"
  - "search-open"
  - "no-search-results"
  - "overflow-current"
dependencies:
  - "NavigationTabs/Tabs sharedContent"
  - "Existing Popover and SearchInput"
  - "Rain arrow-down, close and check-bold icons"
tokens:
  - "Existing overlay-separation Mask tint over background-neutral-1; navigation-only typography and dropdown geometry."
layoutConstraints:
  - "More follows the last visible tab with an 8px gap, including when items reach their 255px maximum width. Hover/open paint retains 8px panel clearance and never becomes a selected union."
  - "Public first item remains visible; selected overflow scope occupies the last visible slot."
  - "Insufficient width reduces item count; More is independent of the selected scope. Its count excludes the shared resource and all visible classes; it is absent when no classes are hidden."
  - "More uses the 64px tab rhythm, with a 360px dropdown aligned bottom/end at 6px offset; existing Popover collision rules constrain it to the viewport."
  - "Dropdown searches all passed items; 200 teaching classes plus one shared scope is the R2 fixture."
  - "Current width budget follows the reference: min(visibleLimit, max(2, floor((width - 188) / 186)))."
compositionRules:
  - "Application owns scope value, business requests, stale-result cancellation, drafts, publishing and synchronization."
  - "Valid scope changes keep the shared content instance; invalid/missing selected scope shows a message and does not silently choose another."
  - "The More control is never a scope item. Loading/error are display inputs and do not fetch data."
accessibility:
  - "Existing manual Tabs keyboard interaction for the strip."
  - "Named nonmodal anchored Popover with initial search focus; selected accepted scope receives focus on close, otherwise trigger restores."
  - "Search results use real buttons and aria-pressed; disabled items cannot be chosen."
antiPatterns:
  - "Using the More button as a tab value."
  - "Resetting the editor or submitting drafts because layout/appearance changes."
  - "Replacing the editable content Tree with a navigation tree."
relatedComponents:
  - "ui-navigation-tabs"
  - "ui-popover"
  - "ui-search-input"
  - "layout-connected-surface"
  - "ui-tree"
stateOwner: "Application owns selected scope/business content; ScopeNavigation owns only open/query/derived visible capacity."
restoreOwner: "Scope dropdown restores to accepted current trigger or the More trigger."
boundaryOwner: "Injected ConnectedSurface is the sole shared contour owner."

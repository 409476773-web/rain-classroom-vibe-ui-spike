density:
  - "沿所组合组件的现有Density合同，新增局部布局不改变原Attachment三档尺寸。"
sourceDifferences:
  - "本地编写Picker/List/Preview/Hook/XHR适配器，保持原Attachment展示层独立。"
  - "本轮视觉仅调整公共List组合与页面私有状态示例；保留原Attachment两个源文件及原G6十二项分母。"
  - "仅栅格图与有限PDF预览；SVG/HTML/Office等退回说明和受限动作。"
verificationLimits:
  - "真实后端、鉴权/配额/恶意文件扫描、资源关系事务和生产持久化未由本组合实现或验证。"
  - "PDF仅检查文件头并强制MIME；Chromium本地原生预览已验证，Safari、VoiceOver、真实触摸与大文件内存需实机验证。"
  - "服务URL的正确响应与访问控制归服务；协议过滤不是内容信任。默认远程下载全量读取内存。"
  - "前端download=false不提供防复制能力；相应PDF不嵌原生查看器，open仍是独立权限。"
  - "功能检查不代表视觉/交互、对比度、发布、Figma或业务迁移接受。"

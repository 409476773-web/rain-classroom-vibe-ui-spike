  externalReferences:
    - "Attachment底层保留shadcn-ui/ui@3ba91b1cc83e1bbe4ab35a422ff2a694849c5048的既有适配；流程代码为Rain本地编写。"
  retainedTraits:
    - "原Attachment Parts、兄弟动作与全卡Trigger关系、原生语义和现有Rain样式。"
  redesignedTraits:
    - "2026-10-16整合视觉方案已完成本地有限实现：描边/填充表面、彩色文件图标、保留扩展名的标题、精简元信息、小状态位与下载/更多操作；范围内自动化回归通过，实际运行视觉仍待用户审阅。"
  intentionallyNotInherited:
    - "不引入外部上传框架、云端Office预览或业务权限引擎。"

styleSourcePath: "packages/ui/src/card/card.styles.ts"
sourceVersion: "shadcn-3ba91b1cc83e1bbe4ab35a422ff2a694849c5048-rain-v2"
publication: "unpublished"
humanGate: "awaiting_human"
automatedVerification: "passed"
verificationEvidence: "evidence/runtime/card-v2/verification.md"
contrastAcceptance: "not-granted"
description: "独立内容对象的非交互容器。默认使用完整 Recipe，有明确需求时再调整其中的部件。"
useWhen:
  - "课程、信息、报表片段或含独立操作的单个内容对象需要边界。"
doNotUseWhen:
  - "仅为页面留白、滚动或区域布局；使用现有布局或 Surface。"
  - "选择卡、可点击整卡、Dialog、拖拽和业务状态管理不属于此 Card。"
exports:
  - "Card"
  - "CardHeader"
  - "CardTitle"
  - "CardDescription"
  - "CardAction"
  - "CardContent"
  - "CardFooter"
parts:
  - "root"
  - "header"
  - "title"
  - "description"
  - "action"
  - "content"
  - "footer"
semantics:
  - "Root article；Title as=h2/h3/h4/h5/h6/p，默认 h3；Description p；Footer footer。"
  - "保留各部件原生属性、aria、ref 和事件；根不添加 role=button、tabIndex 或业务状态。"
props:
  - "variant=panel|raised，默认 panel；raised 是背景与边界映射，无自动阴影。"
  - "size=default|sm，默认 default；只控制 Card spacing，子控件沿用外部 Density。"
  - "localRecipe: RainLocalRecipe<CardPart, ui-card>，根通过薄 Context 传递到自身子树部件；嵌套 Card 重置。"
  - "部件 className 经 rainCn 合并；顺序为基础、部件 className、根 Recipe。"
tokens:
  - "--rain-card-spacing 是根私有组件别名：default=--rain-space-20，sm=--rain-space-12；内层重置默认。20px默认值及本轮间距方案已于2026-09-13获用户确认，见视觉修订计划第10节。"
  - "--rain-card-section-gap 在每个根派生为 min(spacing, Space/16)；放大内边距不同比放大区块距离。"
  - "Rain Radius/8、Line/1、UI 字体、Title 16/24、Description 14/22、Footer 13/22、Content 14/24。"
  - "颜色登记在 token-foundations-v1.json，由 cardPaints 与本批 CSS 消费元数据生成。"
layoutConstraints:
  - "根 flex column；主要区块间距由 section-gap 控制，四周 inset 来自 spacing；Header 细间距 12/4。应用五档内边距为12/16/20/24/32，默认20。"
  - "普通内容组内≤组间≤对应方向内边距；按叠加后的盒距判断。贴边媒体、嵌套容器、独立控件、弹性对齐空白和文字行高按自身语义处理。"
  - "Action/Description 条件仅检查 Header 的直接自有部件；单个轻量 Action 在窄卡仍与标题并排；宽操作通过局部 Recipe 明确独立成行。"
  - "根 overflow visible；媒体局部裁切。Footer 底色和边界由局部 Recipe 决定。"
  - "媒体左右布局最小容器 480px，以下恢复上下；阈值是局部布局候选。"
nativeCssExceptions:
  - "card.css 的 components layer 定义根 spacing、派生 section-gap、容器上下文和直接部件布局，允许 utilities 覆盖。"
  - "card-recipes.css 中 CR-04 字段组间距 min(spacing, Space/12)；Footer 用负 section-gap 抵消根间距，并独占其顶部 section-gap 与底部 spacing，底色切换不改变几何。"
  - "无全局 layer 重排、important、裸颜色、私有 ref Token 或新 Focus 规则。"
dependencies:
  - "现有 React、rainCn、RainLocalRecipe；不新增 headless 或外部依赖。"
recipes:
  - "CR-01 信息卡：无 Action/Footer。"
  - "CR-02 课程媒体卡：同数据上下/左右布局、局部裁切与独立 Button/Tag；封面贴边，正文同步响应内边距预览。"
  - "CR-03 指标片段：Value 22/28、Unit 14/22 使用 data 字体，数值不超过24px；Label 使用 UI 字体。"
  - "CR-04 操作卡：复用 Button/IconButton/Input/Select/DropdownMenu；底部默认与卡片同色、无分隔线、提交右对齐；极浅底色仅作可选样式参考；就近反馈与空字段验证。"
source:
  repository: "https://github.com/shadcn-ui/ui"

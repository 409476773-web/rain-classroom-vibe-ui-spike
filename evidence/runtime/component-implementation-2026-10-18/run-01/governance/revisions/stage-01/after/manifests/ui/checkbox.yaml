id: "ui-checkbox"
name: "Checkbox"
schemaVersion: "1.0"
kind: "RainUiManifest"
category: "ui"
assetIdentity: "registry-candidate"
maturity: "registry-candidate"
modificationMode: "managed"
sourcePath: "packages/ui/src/checkbox/checkbox.tsx"
styleSourcePath: "packages/ui/src/styles.css"
sourceVersion: "local-2026-09-09"
publication: "unpublished"
description: "Native checkbox selection with an existing-library glyph, standard text and description, controlled/default state and native form reset."
useWhen:
  - "Use CheckboxGroup by default for a complete named set with legend, help and validation presentation."
  - "Use Checkbox when the host already owns grouping and accessible context."
doNotUseWhen:
  - "Use Radio / RadioGroup for single choice; answer identities use OptionButton."
  - "For richer options, use the complete selection-card recipes; IndependentPreview, DependentFields and PageSelection own the corresponding orchestration."
anatomy:
  - "Label root, native input, 24px canvas, 16px control, title and optional description."
  - "CheckboxGroup adds fieldset, legend, help, items and message."
parts:
  - "root"
  - "input"
  - "control"
  - "label"
  - "description"
props:
  - "Checkbox: checked or defaultChecked, onCheckedChange, label or native accessible name, description, indeterminate, native input attributes/ref."
  - "CheckboxGroup: options with unique non-empty string values, legend, value or defaultValue, onValueChange, name/form, disabled, orientation, legendHidden, help/message, invalid and required."
  - "Controlled state requires its callback and cannot have a default; default state resets without a selection callback."
  - "className is layout only; localRecipe applies named feature-scoped changes to declared Checkbox parts."
slots: []
variants:
  - "Standard text with optional non-interactive description."
  - "Group orientation vertical by default or horizontal with wrapping."
states:
  - "unchecked"
  - "checked"
  - "mixed"
  - "hover"
  - "pressed"
  - "focus-visible"
  - "disabled"
dependencies:
  - "内部 SelectionControlSurface 共享 label、指示器与标准内容；原控件保留唯一原生 input、事件、ref、name 校验与 reset。"
  - "react"
  - "@rain-next/foundations"
  - "tailwind-merge"
  - "icon/check-bold"
  - "icon/minus-bold"
tokens:
  - "Space/24 canvas, Space/16 control, Radius/4, Line/Thickness/1, Space/8 control-content, Space/4 title-description, Space/12 group gap."
  - "UI 15/24/600 title and 13/22/400 description; title 600 is visually accepted for this SC-01 slice in place of original 500."
  - "Text/Neutral/3; Fill/Brand/Solid/2; Border/Brand/1; OnColor/1."
  - "Border/Neutral/1 with existing Alpha/65 replacement via --rain-local-checkbox-boundary, visually accepted local recipe without global promotion."
  - "Disabled Fill/Neutral/Solid/2, Border/Neutral/2, Icon/Neutral/4 and Text/Neutral/4; important description retains Text/Neutral/3."
  - "Hover: 21px highlight within the 24px canvas, inset Space/6 divided by 4, Radius/4, lighter Fill/Neutral/Alpha/3; pressed: Fill/Neutral/Alpha/2. Unchecked control is transparent with local Border/Neutral/1 Alpha/85. Checked/mixed retains Fill/Brand/Solid/2 on hover and uses Solid/1 when pressed, with OnColor/1."
  - "Shared Focus and existing 10px icon box."
densities:
  compactDefault: "24px canvas / 16px control"
  defaultDefault: "24px canvas / 16px control"
layoutConstraints:
  - "The entire label activates one input; no independent interactive children."
  - "Control stays aligned to the first title line; long text wraps inside the available width."
  - "Default and compact keep the same control geometry; do not infer new size variants."
compositionRules:
  - "Indeterminate is visual/ARIA state over a boolean checked value, never a third submitted value."
  - "CheckboxGroup retains disabled and non-rendered IDs in the model when other options change."
  - "FormData includes only named checked enabled rendered inputs; it is not the complete domain model."
  - "A group required hint does not require every item. The host checks at least one value, displays the message and focuses an enabled input."
  - "Uncontrolled reset restores the latest declared defaults, honors cancellation and follows the currently associated form. Controlled owners handle reset explicitly."
  - "Selection callbacks occur once for user changes, not prop updates, canceled activation or default reset."
allowedModifications:
  - "Choose the complete recipe, supplied labels, orientation, selection and native form attributes."
  - "Use named Local Recipes for declared Checkbox parts and register any local Token changes."
restrictedModifications:
  - "Do not replace native checked semantics with aria-pressed or a button."
  - "Do not replace library glyphs with raw SVG or text symbols."
  - "Do not introduce unregistered colors, arbitrary visual values, new dependencies or global Token changes."
  - "Do not place controls inside labels or infer visual/contrast acceptance from automated tests."
accessibility:
  - "Native keyboard focus and Space activation; visible label and separate description IDs."
  - "Native fieldset/legend gives the group name; help/message describes the group and each item."
  - "Native disabled blocks activation and excludes submission; important reasons remain readable."
  - "Mixed sets both DOM indeterminate and aria-checked=mixed; forced colors retain the library mark."
  - "Canceling native activation does not change UI, callbacks or submitted state."
examples:
  - "#checkbox"
recipes:
  - "CheckboxGroup complete standard form recipe"
  - "Checkbox standalone labeled control"
antiPatterns:
  - "Making every item required to require one group selection."
  - "Discarding disabled or offpage selected IDs when an enabled option changes."
  - "Treating FormData as all selected business values."
relatedComponents:
  - "OptionButton"
  - "FormItem"
  - "Radio"
relatedBlocks: []
visualLineage:
  rainClassicReferences:
    - "Rain Classic Checkbox / CheckboxGroup; source snapshot in evidence/selection/sc00-preflight.json."
  externalReferences:
    - "https://ui.shadcn.com/docs/components/base/checkbox"
    - "https://ant.design/components/checkbox/"
    - "https://mui.com/material-ui/react-checkbox/"
  retainedTraits:
    - "24px canvas, 16px rounded control, existing bold check, standard description hierarchy."
  redesignedTraits:
    - "Established Token-only geometry and themed paint; native React controlled/default APIs."
  intentionallyNotInherited:
    - "Original 500 weight, 1.4px line and unmatched raw description color; differences are recorded, not silently reproduced."
sourceEvidence:
  - "docs/audits/2026-09-09-selection-sc00-preflight.md"
  - "evidence/selection/sc00-preflight.json"
  - "docs/plans/2026-09-09-checkbox-sc01-implementation.md"
  - "evidence/runtime/checkbox/interactions/figma-reference.json"
migrationNotes:

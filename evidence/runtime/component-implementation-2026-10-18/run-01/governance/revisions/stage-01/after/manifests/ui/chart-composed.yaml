description: "图表：面积、柱、线组合报告，人数与完成率使用各自坐标轴。"
useWhen:
  - "同一日期或分类比较人数及比率，例如参与人数、完成人数、完成率。"
doNotUseWhen:
  - "混用不同量纲却共用同一轴；零分母强制写成0%。"
anatomy:
  - "宿主标题/单位、原生图形、精确读数/数据表。"
parts:
  - "ComposedChart"
  - "Area"
  - "SeriesBar"
  - "Line"
  - "Grid"
  - "XAxis"
  - "YAxis"
  - "ChartTooltip"
  - "ChartLegend"
  - "ReferenceArea"
  - "ChartMarkers"
  - "ProjectionLine"
  - "ProjectionLineEndMarker"
  - "LineSeriesTerminalMarker"
props:
  - "SeriesBar.yAxisId与Line/Area一样绑定逐轴scale；yDomains={axisId:[0,upper]}固定域不nice，upper须有限且为正；堆叠柱同组同轴。"
  - "xMode=time默认日期；显式category使用xDataKey稳定字符串ID、xLabel(datum)显示名称，输入顺序等距定位，同名不同ID保留。"
  - "data共享时间或分类行；Area/SeriesBar表达数量，Line yAxisId=right表达0—100比率。"
  - "YAxis分别绑定left/right；右轴formatValue显示%；SeriesBar是组合图柱原语，不能与分类Bar互换。"
slots:
  - "原生children/提示render回调；宿主布局、业务筛选及数据表。"
variants:
  - "人数面积+完成柱+右轴比率线"
states:
  - "正常、悬停/焦点、更新/重播；动效/减少动效分别检查。"
  - "全零参与时不绘制比率线并显示不适用；混合null缺测保留系列断口，已知零分母由宿主显示不适用。"
  - "空/无效状态由宿主先校验并说明，非通用数据适配器。"
dependencies:
  - "React/React DOM、Rain Foundations；实际固定npm及类型依赖见registry/charts.json。"
tokens:
  - "Rain表面、文字、网格、提示、指示器和Focus角色，公共规则见packages/ui/src/charts/README.md。"
  - "人数/比率系列身份、轻面积和可选原生柱渐变；图例及提示色标一致。"
layoutConstraints:
  - "默认320px高；左右margin需容纳纵轴长值及首尾SeriesBar外沿。"
  - ".rain-chart为独立样式作用域，需可测量尺寸；不依赖实验页祖先或全局Bklit reset。"
compositionRules:
  - "category不使用Date或时间降采样；分类Brush/Projection、日期标记/参考区域及LiveXAxis明确拒绝。时间模式保持原合同。"
  - "完成率=完成人数/参与人数*100；左轴人，右轴%；完成数不得超出参与数。"
  - "保留Bklit原生Parts与默认展示强度；数据/单位/分母与色标、提示和表值一致。"
allowedModifications:
  - "通过原生Props/Parts选择已列配方、尺寸、标签、单位及受控状态；宿主拥有数据校验。"
restrictedModifications:
  - "不改全局Token、品牌主蓝或偷偷扩大到未支持数据合同；不从vendor私有路径绕过公共入口。"
accessibility:
  - "宿主提供标题、单位、文本状态和精确数据表；图例可用renderItem接入button焦点。"
  - "原生hover不代表所有点键盘可达；真实读屏/物理触屏/完整对比度未登记通过。"

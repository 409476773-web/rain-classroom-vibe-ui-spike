tokens:
  - "优先复用 Rain 现有语义 Token；临时视觉值集中于 G3 局部 CSS，待 Foundation Gate 审计。"
layoutConstraints:
  - "宿主决定方向与宽度，长内容在面板内滚动；浮层不得被遮罩遮挡。"
  - "Header / Footer 不参与正文滚动；Body 保留 min-height:0、overflow:auto 与键盘焦点。"
  - "共享侧向宽度仍为 min(420px,100vw)；文档任务示例 480px 为局部 Recipe，不是公共默认。"
compositionRules:
  - "共享组件只处理通用交互与语义；路径、数据及执行结果由宿主负责。"
  - "详情使用 Header + Body，Footer 按任务需要添加；编辑用 Footer 关联正文 form 的统一提交。"
  - "Title / Description 在 Header 内由 Header 提供间距；已有独立组合仍保留原间距。"
  - "关闭不等于保存；草稿、校验、取消与提交结果由宿主显式管理。"
allowedModifications:
  - "宿主内容、受控状态、局部尺寸与密度 Recipe。"
restrictedModifications:
  - "不修改基础 Token，不引入成熟库默认视觉，不直接访问业务接口。"
accessibility:
  - "Escape、遮罩关闭及触发器焦点恢复由 Base UI Drawer 提供。"

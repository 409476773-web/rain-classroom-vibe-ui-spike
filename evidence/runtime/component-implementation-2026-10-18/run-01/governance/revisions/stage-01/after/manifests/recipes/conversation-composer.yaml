schemaVersion: "1.0"
kind: "RainRecipeManifest"
id: "recipe-conversation-composer"
name: "Conversation Composer"
category: "recipe"
assetIdentity: "registry-candidate"
maturity: "registry-candidate"
migrationLabel: "react-only"
modificationMode: "managed"
publication: "unpublished"
sourcePath: "packages/ui/src/conversation-composer/index.ts"
sourceVersion: "Rain authored conversation composer 2026-10-15; confirmed design and implementation plans"
description: "AI对话与讨论共用的受控输入组合：四种表面布局、附件、资料引用、范围、回复、真实浏览器录音与可恢复转写。"
useWhen:
  - "AI对话或讨论需要同一编辑器承载正文、附件、上下文及发送反馈。"
  - "宿主拥有会话和业务服务，组合处理输入、资料临时选择及浏览器录音生命周期。"
doNotUseWhen:
  - "只需普通多行字段；应使用Textarea。"
  - "需要内置聊天后端、课程权限引擎、上传存储、ASR、消息队列或跨刷新草稿恢复。"
anatomy:
  - "root/form"
  - "context/reply/references/attachments"
  - "editor"
  - "toolbar/add-menu/source-scope/layout/voice/primary-action"
  - "feedback"
  - "reference-picker"
  - "attachment-preview"
parts:
  - "ConversationComposer"
  - "root"
  - "context"
  - "editor"
  - "toolbar"
  - "primary-action"
  - "feedback"
props:
  - "必填conversationId/draft/draftRevision/onDraftChange/aria-label/onSubmit；ref为HTMLTextAreaElement。"
  - "draft为text/references与可选reply/sourceScope；上下文变化由宿主更新修订号。"
  - "surface: gray|white；layout: compact|expanded；受控layout需onLayoutChange。"
  - "attachments: items/constraints/rejections/removingIds/onClearRejections/onFiles/onRetry/onCancel/onRemove；复用宿主上传Hook。"
  - "references: query(query,{signal})及resolve(ids,{signal})；返回稳定id/name/availability/unavailableReason。"
  - "sources: value/label/description/disabledReason；onLocateReply由宿主定位消息。"
  - "voice: transcribe(blob,{signal,mimeType})与可选onPermissionHelp。"
  - "submission: idle|pending|failed；submitBlockedReason由宿主业务规则提供。"
  - "generation: running/onStop；可选formLabel/placeholder/sendLabel/disabled/readOnly/className。"
slots:
  - "能力通过attachments/references/sources/voice/generation显式传入；不开放重写内部交互的任意渲染槽。"
variants:
  - "surface=gray|white与layout=compact|expanded为独立两轴，共四组合；默认gray/compact。"
states:
  - "空稿、可发送、正文自然增高、内部滚动、输入法组合、disabled/readOnly。"
  - "附件等待/上传/处理/完成/失败/取消/移除；资源可用性和权限独立。"
  - "资料加载/空资料/空搜索/加载失败/临时已选/确认复核/缺失或不可用。"
  - "语音idle/requesting/recording/transcribing/retained；retained可重试或丢弃。"
  - "发送idle/pending/failed；AI生成中主操作为停止，下一稿独立。"
dependencies:
  - "复用React、@base-ui/react、class-variance-authority、tailwind-merge及Rain Foundations；无新增npm依赖。"
  - "Button/IconButton/DropdownMenu/Popover/Checkbox/Input/RadioGroup/Attachment/AttachmentWorkflow及实际单图标见registry/conversation-composer.json。"
tokens:
  - "仅使用已有Background/Border/Text/Icon/Fill的Neutral、Brand、Red语义角色。"
  - "PingFang UI字体、现有Typography/Space/Radius/Line/Focus/Shadow语义Token；不新增Foundation。"
layoutConstraints:
  - "两态均为全宽正文和下方固定工具行；compact自然增高后内部滚动，expanded增加书写空间。"
  - "同宽、相同布局及相同行数条件下比较等高；Popover通过portal独立定位，不撑高输入器。"
  - "资料与范围浮层按内容限高，不要求同高；已添加资料区域最多min(192px,30dvh)，支持键盘滚动。"
  - "超过3项资料收纳已就绪项；异常及进行中项不被收纳，需处理项按真实DOM顺序优先，正文与工具在滚动区域外。"
  - "布局切换使用既有220ms区域动效连续改变正文外壳高度，支持反向；输入、宽度与会话变化即时更新，减少动效时无过渡。"
  - "窄容器400px以内资料名最多两行，恢复动作在独立行；来源类别使用中性色。"
  - "本组合底部次级按钮28/16、发送与重试32/16、停止动作32/18；范围高28px，工具组间距2px、正文与工具间距6px、底部留白8px。"
  - "用户2026-10-16明确要求极浅占位提示：textarea placeholder使用text-neutral-6与55%不透明度；正式正文不变，强制颜色模式使用系统GrayText。"
compositionRules:
  - "正文和上下文单一受控草稿；附件草稿由宿主useAttachmentUpload拥有，显式autoUpload:true。"
  - "Enter换行；当前没有快捷键发送；输入法组合不触发提交。"
  - "onSubmit仅发送意图；宿主同步锁定、冻结提交快照、维护clientMessageId，明确业务接收后才清对应草稿。"
  - "未知接收状态由宿主按同一clientMessageId核对；网络重试不生成重复消息。"
  - "基础组件允许可用附件消息；引用/回复/范围本身不构成正文；宿主可用submitBlockedReason要求文字。"
  - "query搜索不丢临时已选；confirm对全部ID resolve；缺失/不可用保留名称，可取消勾选，全部有效才应用。"
  - "sourceScope完全由宿主解释；删除最后引用保留原范围并阻止发送，不静默扩大课程范围。"
  - "回复对象独立于资料权限；onLocateReply与消息滚动归宿主。"
  - "真实录音交由宿主ASR；尝试绑定会话/修订/插入位置，取消及迟到结果不得污染新草稿。"
  - "AI生成与消息接收分离；停止生成只取消当前回答，不提交或清理下一稿。"
allowedModifications:
  - "通过公开Props切换表面/布局、提供真实上传/资料/ASR/消息/AI适配器及宿主范围选项。"
  - "通过className调整宿主排布；局部Recipe与现有Token仍遵守公共组件合同。"
restrictedModifications:
  - "不得让共享组合依赖页面消息模型、业务路由、默认生产接口或服务凭据。"
  - "不得复制上传引擎、Popover、Checkbox或另造全局状态/持久化平台。"
  - "不得把本地上传ID、固定模拟转写或本地接收当真实服务能力。"
  - "不得重写原G6十二项分母、旧source-lock或自动关闭人工Gate。"
accessibility:
  - "具名原生form/textarea/file input；动作可访问名称与文件/引用名对应。"
  - "复用DropdownMenu/Popover/Checkbox/Input/RadioGroup/Dialog的键盘和焦点合同。"
  - "菜单先关闭再打开资料选择器；搜索框获焦；取消/Escape回添加按钮，确认回编辑器。"
  - "附件重试与取消立即回到正文，避免临时动作消失后焦点丢失。"
  - "布局切换保留textarea节点；录音与发送状态可播报；Focus、reduced-motion和forced-colors沿已有Token。"
examples:
  - "packages/ui/src/conversation-composer/README.md"
  - "apps/playground/src/docs/components/conversation-composer-page.tsx"
  - "apps/playground/src/docs/components/g6-course-conversation.tsx"
recipes:
  - "AI: 受控草稿 + 上传Hook + query/resolve + sourceScope + ASR + generation。"
  - "讨论: 受控草稿 + 附件 + reply/onLocateReply + 宿主接收确认。"
antiPatterns:
  - "发送点击后立即清稿，或把A的迟到响应应用到B。"
  - "仅以附件done或传输100%推导可检索/有权限/业务接收。"
  - "删除最后引用后自动改为全课程，或以UI单选替代服务权限边界。"
  - "将示例useG6Composer、mockG6Upload、mockG6Transcribe登记为公共服务SDK。"
relatedComponents:
  - "ui-textarea"
  - "ui-button"
  - "ui-icon-button"
  - "ui-dropdown-menu"
  - "ui-popover"
  - "ui-checkbox"
  - "ui-input"
  - "ui-radio-group"
  - "ui-attachment"
  - "ui-message-scroller"
relatedBlocks: []
relatedRecipes:
  - "recipe-attachment-workflow"
visualLineage:
  rainClassicReferences:
    - "沿用已登记Rain输入、按钮、附件、弹层、图标及语义Token，依据两份2026-10-15规划中的既有G6核对。"
  externalReferences:
    - "规划中对成熟消息输入模式的只读研究与六张用户确认图；具体来源及图稿路径见设计方案。"
    - "所组合Attachment/Progress保持各自既有shadcn来源记录，Popover/DropdownMenu保持Base UI行为来源。"
  retainedTraits:
    - "Rain现有字体、蓝色主动作、中性表面、图标、Focus与附件/弹层语义。"
    - "本轮按最终图核实available资产：发送publish-filled（用户2026-10-16指定，PublishFilledIcon，182:695）、线性麦克风microphone-on（MicrophoneOnIcon，99:44）、布局maximize/minimize、结束录音与停止生成stop-playback；仅记录本组合的实际选择。"
  redesignedTraits:
    - "将G6两个私有输入区域合为同一受控组合，四种表面布局、临时引用确认、真实录音及恢复路径。"
  intentionallyNotInherited:
    - "不复制第三方整页、业务模型、默认接口、跨刷新队列或生产验收。"

density:
  - "继承宿主Density与各既有控件尺寸合同；Popover沿现有compact内容上下文。"
sourceDifferences:
  - "本地新增受控ConversationComposer、内部资料选择器、语音Hook和样式，复用现有UI/AttachmentWorkflow。"
  - "业务提交与会话状态保留页面适配；内部helper不从根入口公开。"
  - "用户授权体验优化：范围始终可见，空稿安静，局部错误去重，独立业务限制保留；失败发送沿原按钮使用refresh图标。"
  - "第二轮授权修订：全宽书写、稳定工具行、统一来源资料项、选择整行反馈、真实录音时长与减少动效支持。"
  - "实际页面复查：连续展开收起、长稿阅读位置、窄屏恢复动作与附件重试回焦。"
  - "本地整体验收修复：省略可选removingIds时仍跟踪异步移除、阻止发送和重复移除，旧会话操作隔离。"
verificationLimits:
  - "真实上传、课程权限与检索、ASR、消息接收状态核对和AI服务均需实际接口及接入验收。"
  - "浏览器录音与模拟ASR分别记录；固定模拟转写不证明识别能力。"
  - "录音Blob只保存在实例内存；刷新/卸载/切会话后的持久恢复未实现。"
  - "当前本地版本整体已获用户明确验收；真实Safari、VoiceOver、触摸、软键盘与物理麦克风设备仍需独立验证。"
  - "自动化通过不授予对比度、Figma、发布、生产或业务迁移接受。"


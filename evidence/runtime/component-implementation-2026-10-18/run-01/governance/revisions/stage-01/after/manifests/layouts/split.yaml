  rainClassicReferences:
    - "VE-009 主从预览/独立Inspector"
    - "VE-012 主从职责"
    - "VE-014 双列表单和长内容"
  externalReferences: []
  retainedTraits:
    - "主从分区、明确的间距和对齐、UI/布局职责分开"
  redesignedTraits:
    - "React有限布局API、容器自适应、保留挂载与受控焦点恢复"
  intentionallyNotInherited:
    - "Classic Template样式、任意多Pane、拖拽与持久化"
figmaMapping:

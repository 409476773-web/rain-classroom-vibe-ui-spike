verification:
  automated: "passed"
  independentReview: "passed"
  humanGate: "awaiting_human"
  spacingHierarchy:
    humanGate: "accepted"
    humanGateScope: "layouts-spacing-runtime-visual-only"
    evidence: "evidence/runtime/spacing-hierarchy/outer-cards/visual-acceptance.md"
  contrastAcceptance: "not-granted"
  evidence: "evidence/runtime/spacing-hierarchy/outer-cards/verification.md"

discovery:
  version: 1

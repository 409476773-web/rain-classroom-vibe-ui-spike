tokens:
  - "default Fill/Brand/Solid/2+OnColor/1；secondary Background/Neutral/2、muted Fill/Neutral/Solid/5。"
  - "tinted Fill/Brand/Solid/4+Text/Brand/1；outline中性表面/边界；destructive Red浅表面+Text/Red/1。"
  - "正文Reading14/24，Radius12；reactions中性底/外环和Font UI14/22。"
layoutConstraints:
  - "内容w-fit/max-width80%，ghost100%；Reactions top/bottom向外75%，宿主留叠层空间。"
  - "Reaction start/end用logical inset；Group纵排，不根据sender数据自动分组。"
compositionRules:

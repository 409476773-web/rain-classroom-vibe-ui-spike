restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "可操作Content使用真实button/a和名称；reaction动作各自命名，静态emoji可一次性描述。"
  - "失败同时提供错误文字；reduce关闭颜色过渡，forced-colors保留边界/Focus。"

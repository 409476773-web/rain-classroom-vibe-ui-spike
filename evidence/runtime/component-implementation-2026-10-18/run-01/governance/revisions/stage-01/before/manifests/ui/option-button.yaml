tokens:
  - "Existing Space, Radius, Line, UI typography and shared Focus tokens"
  - "Neutral default, Brand selected, OnColor selected text and disabled semantic colors"
  - "Review identity uses Green/Red Solid/2 with OnColor/1 text or library glyph; no visible result caption."
  - "Selected text rows use the existing weak Brand border; selected option bodies have no border."
sizes:
  - "20/24/28/32/36/40; default 28; 20 is an embedded compact supplement"
  - "Standalone target adds 6 / 4 px padding in default / compact; row/card padding and gap are 12 / 8 px"
  - "Identity font/line-height: 11/16,12/18,14/20,15/22,16/24,18/26; square radius 4,6,6,6,8,8"
  - "Judgment glyph sizes: 12,14,16,18,20,22; body text remains 15/22"
densities:
  compactDefault: "28"
  defaultDefault: "28"
layoutConstraints:
  - "The whole text row labels the same input; do not nest a second interactive control."
  - "Keep the chosen identity size visible when wrapping long plain text; never shrink text by label length."
  - "Cards wrap with the existing Space/32 × 8 minimum; numbering size does not resize images or body text."
compositionRules:
  - "A selected radio remains selected when activated again; checkboxes toggle independently."
  - "Use one controlled value for single selection and a controlled value list for multiple selection."
  - "OptionGroup shares one native name within its set and isolates its generated name from other groups."
  - "Selected option identity uses stronger weight and no body border; a selected text row retains its weak blue boundary."
  - "Single-choice circular shape and QuestionNumber circular child shape have different context-specific meanings."
  - "Evaluation is explicitly supplied and disclosed by the host; unselected correct options never receive inferred feedback."
  - "Business grading, progress, appeals and navigation remain outside this selection component."
allowedModifications:
  - "Choose the complete Group recipe, size, native selection type, appearance and plain text."
  - "Use named feature-scoped Local Recipes for declared Parts."
restrictedModifications:
  - "Do not substitute aria-pressed or aria-current for native checked semantics."
  - "Do not permit radio deselection by repeat activation."
  - "Do not override input association, native keyboard Focus or disabled behavior in a visual recipe."
  - "Do not add new dependencies, raw colors, private tokens or arbitrary visual values."
accessibility:
  - "Native radio/checkbox inputs own checked state, keyboard behavior and form submission."
  - "Visible option identity and optional text label the input; the group has a visible legend."
  - "OptionGroup uses radiogroup for single selection and fieldset group semantics for multiple selection."
  - "Native disabled prevents activation; shared focus-visible remains separate from selection."
  - "Screen-reader-only input styling must preserve focusability and the label's complete target."
  - "Readonly preserves names, focus, values and readable result descriptions without permitting answer changes."
  - "Judgment symbols retain the option label; disclosed result descriptions remain available to assistive technology without a visible caption. Media requires alt text."
examples:
  - "/question-option-sizes.html"
  - "#option-button"
recipes:
  - "OptionGroup: complete single or multiple selection"
  - "OptionButton: directly composed native option"
antiPatterns:

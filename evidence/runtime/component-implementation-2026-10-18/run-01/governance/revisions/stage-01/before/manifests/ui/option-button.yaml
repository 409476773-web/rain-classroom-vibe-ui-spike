description: "Native single or multiple answer selection with a six-size standalone option, text row, explicit result review or image card."
useWhen:
  - "Use OptionGroup by default for a complete, named set of answer options."
  - "Use OptionButton directly when a host already owns the native group and its accessible context."
doNotUseWhen:
  - "Navigating the current question; use QuestionNumber instead."
  - "Inferring undisclosed answers or embedding independent zoom/playback actions in a choice."
anatomy:
  - "Group: native fieldset and visible legend"
  - "Root: clickable label for the native input"
  - "Input: radio or checkbox owns selection, keyboard and form behavior"
  - "Control: six-size option body; default 28 px"
  - "Label: option identity"
  - "Content: optional plain option text"
  - "Media: non-interactive image or chart with meaningful alt text"
parts:
  - "root"
  - "input"
  - "control"
  - "label"
  - "content"
  - "media"
props:
  - "size: 20, 24, 28, 32, 36 or 40; default 28 in both densities"
  - "OptionGroup: options, legend, mode, controlled value and onValueChange"
  - "OptionGroup: optional name, disabled, appearance, layout className and item localRecipe"
  - "OptionButton: type radio or checkbox, value, label, controlled checked and onCheckedChange"
  - "OptionButton: optional plain text, appearance filled or outlined, disabled and native input attributes/ref"
  - "Radio inputs require a non-empty group name; OptionGroup supplies an isolated name by default."
  - "readOnly preserves readable values and focus while preventing answer changes."
  - "feedback none/correct/wrong only appears for checked options when feedbackVisibility is visible; hidden by default."
  - "symbol true/false uses the user-specified icon/check-bold and icon/close-bold as option identity; media accepts src and meaningful alt text."
  - "className: layout only"
  - "localRecipe: named feature-scoped Part recipe"

description: "单档 13px 面包屑：返回上级、整项展开同级菜单、按容器折叠祖先与截断提示。"
useWhen:
  - "页面存在真实层级，用户需要定位当前位置和返回上级。"
  - "同一层级存在可导航的替代分支。"
doNotUseWhen:
  - "展示操作历史、步骤进度或页面内分区切换。"
anatomy:
  - "root"
  - "list"
  - "item"
  - "link"
  - "text"
  - "page"
  - "separator"
  - "ellipsis"
  - "back"
  - "menu-trigger"
parts:
  - "root"
  - "list"
  - "item"
  - "link"
  - "text"
  - "page"
  - "separator"
  - "ellipsis"
  - "back"
  - "menu-trigger"
props:
  - "Breadcrumb: items?: readonly BreadcrumbEntry[]，或 compound children，二者互斥。"
  - "BreadcrumbEntry: id、label、href?、disabled?、siblings?；路径 ID 唯一且名称非空。"
  - "BreadcrumbDestination: id、label、href?、disabled?；无 href 为静态菜单分组。"
  - "Link/Back: 原生 anchor 属性及 disabled；禁用时移除 href 并阻止点击。"
  - "Menu: label、text?、current?、children、disabled?、overflow?；必须置于 Item 中，组合既有 DropdownMenu 内容。"
slots:
  - "children: Compound API，支持自定义分隔符与菜单内容。"
variants:
  - "唯一尺寸：13px / 18px，Regular 400，22px 视觉底，24px 命中高度。"
states:
  - "default"
  - "hover"
  - "pressed"
  - "focus-visible"
  - "current"
  - "disabled"
  - "menu-open"
  - "truncated"
  - "collapsed"
dependencies:
  - "React"
  - "DropdownMenu / Base UI 1.8.0"
  - "Tooltip"
  - "ArrowDownIcon"
  - "MoreHorizontalIcon"
tokens:
  - "rain-font-ui、rain-font-size-13、rain-line-height-18、rain-font-weight-regular"
  - "rain-category-text-neutral-4 / neutral-1 / neutral-6"
  - "rain-category-fill-neutral-alpha-4 / alpha-3、rain-category-icon-neutral-3 / neutral-4"
  - "rain-radius-6、rain-space-4 / 6 / 24、rain-focus-width / item / offset"
layoutConstraints:
  - "items 模式按实际容器宽度折叠；优先根节点 + 省略 + 父级 + 当前页，再省略 + 父级 + 当前页。"
  - "单行展示，名称超长截断；祖先最大 24ch，父级及当前页最大 32ch。"
  - "宿主负责提供可用宽度；箭头固定热区不能缩小，超窄到无法容纳固定控件时宿主需调整头部布局。"
  - "Compound 模式保留宿主列表顺序，不自动推断层级或折叠。"
compositionRules:
  - "可下拉项的文字与箭头整项切换菜单；Hover/Pressed/Focus/Open覆盖整项。当前页可为菜单按钮，否则静态。"
  - "items 的最后一项为当前页；有同级菜单时整项为按钮，否则有 href 的上级为链接、无 href 为静态分组。"
  - "仅当存在其他有 href 且未禁用的同级目标时显示箭头；当前分支由菜单选中标记提示。"
  - "菜单展开时抑制该项 Tooltip；省略菜单只列隐藏祖先，不混入同级项。"
  - "路由、权限、有效新路径及导航后的内容焦点由宿主负责。"
allowedModifications:
  - "宿主路径、链接和同级目标"
  - "Compound 内容及局部布局"
restrictedModifications:
  - "未经授权变更 Foundation Token、默认字号或品牌视觉"
  - "把页面历史作为路径自动拼接"
accessibility:
  - "具名 nav、ol/li、当前页 aria-current=page，分隔符 aria-hidden。"
  - "普通链接或整项下拉按钮分别进入 Tab，菜单支持方向键、Enter、Escape 与关闭后的焦点恢复。"
  - "截断文本复用 Tooltip；静态当前页仅截断时成为键盘焦点，禁用文本不进入 Tab。"
  - "缩窄隐藏聚焦祖先时移焦至省略；展开移除聚焦省略时移焦至可用祖先入口。"
examples:
  - "apps/playground/src/docs/components/breadcrumb-page.tsx"
  - "apps/prototype/src/scenarios/token-first-g3/page.tsx"
recipes:
  - "页面头部的返回、标题、操作独立于面包屑组合"
antiPatterns:
  - "可下拉项拆为文字链接与独立 IconButton"
  - "切换同级后继续拼接旧详情"
  - "用禁用色表示没有独立页面的分组"

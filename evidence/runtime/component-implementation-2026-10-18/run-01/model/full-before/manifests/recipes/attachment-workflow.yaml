density:
  - "沿所组合组件的现有Density合同，新增局部布局不改变原Attachment三档尺寸。"
sourceDifferences:
  - "本地编写Picker/List/Preview/Hook/XHR适配器，保持原Attachment展示层独立。"
  - "前一视觉轮调整公共List组合与页面私有状态示例；本轮追加已确认的四场景、尺寸/排列、紧凑Picker与原生视频预览；保留原Attachment两个源文件及原G6十二项分母。"
  - "栅格图、有限PDF与MIME/后缀匹配的原生MP4/WebM/Ogg视频预览；SVG/HTML/Office等退回说明和受限动作。"
verificationLimits:

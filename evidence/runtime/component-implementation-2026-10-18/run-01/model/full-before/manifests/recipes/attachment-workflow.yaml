  - "PDF仅检查文件头并强制MIME；Chromium本地原生预览已验证，Safari、VoiceOver、真实触摸与大文件内存需实机验证。"
  - "服务URL的正确响应与访问控制归服务；协议过滤不是内容信任。默认远程下载全量读取内存。"
  - "前端download=false不提供防复制能力；相应PDF/视频不嵌原生查看器，open仍是独立权限。"
  - "功能检查不代表视觉/交互、对比度、发布、Figma或业务迁移接受。"

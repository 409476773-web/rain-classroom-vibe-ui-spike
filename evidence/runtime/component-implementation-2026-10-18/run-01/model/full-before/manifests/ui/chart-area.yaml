description: "图表：连续时间趋势、清晰线与轻渐变面积，保留原生聚焦；支持96×32 / 128×48迷你尺寸配方。"
useWhen:
  - "需要比较同量纲时间趋势或用轻面积表达变化。"
doNotUseWhen:
  - "需要互斥类别占比或未经说明的堆叠总量。"
anatomy:
  - "宿主标题/单位、原生图形、精确读数/数据表。"

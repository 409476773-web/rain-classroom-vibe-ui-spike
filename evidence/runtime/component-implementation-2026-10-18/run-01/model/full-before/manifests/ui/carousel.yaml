    - "Focus宽/offset沿既有Token，灰色轮廓与主题表面halo属于本轮控件局部配方；Arrow和Play/Pause采用现有图标；根内--rain-local-carousel-control-ink/strong/disabled/white/surface登记派生灰度，white历史名为Background/Neutral/1去色主题表面，不改变全局Neutral/Focus。"

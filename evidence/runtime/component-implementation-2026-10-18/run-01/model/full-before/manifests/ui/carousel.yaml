sourceVersion: "shadcn-ui/ui@3ba91b1cc83e1bbe4ab35a422ff2a694849c5048; rain-carousel-v04-upgrade-2026-10-14; controls-visual-feedback-01"
description: "由Embla维护位置、拖动和吸附，具备浅灰组合控件、真实停靠点指示和可暂停定时/连续播放的轮播。"
useWhen:
  - "课程素材需要单图/多卡轨道、拖动、前后导航及显式定时/连续播放。"
  - "需要横向或纵向布局、方向上下文和Embla已有Options/API。"
doNotUseWhen:
  - "增加第二selectedIndex/transform引擎或不协调的自动播放插件。"
  - "仅装autoplay插件但没有暂停/恢复、聚焦/悬停停止合同。"
anatomy:
  - "root"
  - "content"
  - "item"
  - "previous"
  - "next"
  - "controls"
  - "indicators"
  - "indicator"
  - "playback-control"
parts:
  - "root"
  - "content"
  - "item"
  - "previous"
  - "next"
  - "controls"
  - "indicators"
  - "indicator"
  - "playback-control"
props:
  - "Carousel原生div Props/ref + opts/plugins/setApi/orientation(horizontal默认|vertical) + 显式playback，公开CarouselApi/Options/Plugin及useCarousel。"
  - "playback为autoplay(delay毫秒)/continuous(speed为px/s)，direction=forward|reverse、start可选；非正或非有限值报错。"
  - "Controls layout=inline|overlay、indicatorPlacement=top|bottom|start|end；Indicators getLabel提供具体停靠语义；PlaybackControl默认文字+图标，showLabel=false可用紧凑图标形式。"
  - "方向优先opts.direction→明确dir→Base UI context；orientation优先于opts.axis。"
  - "Content className/style/ref作用inner flex容器；viewport ref由内部Embla拥有。"
  - "Previous/Next采用合法Rain Button Props和ref，children可选；默认真实IconButton36/20，显式variant/size/children等转house Button。"
slots:
  - "Carousel"
  - "CarouselContent"
  - "CarouselItem"
  - "CarouselPrevious"
  - "CarouselNext"
  - "useCarousel"
  - "CarouselControls"
  - "CarouselIndicators"
  - "CarouselPlaybackControl"
variants:
  - "水平/纵向、单页/多项/RTL；loop等Options由Embla消费。"
states:
  - "select/reInit/scrollSnaps/edge availability由实际API决定；0/1停靠不显示指示器，无可滚动内容不启动自动。"
  - "只读来源引擎resolved active（包含breakpoints）阻止inactive下的autoplay/continuous；reInit恢复active仅恢复此前启用意图。唯一internalEngine读取不触碰位置、速度、limit或animation。"
  - "overlay的PlaybackControl保留实际指针点击；遮挡与媒体安全区由宿主style定位，主例播放入口放内容外。"
  - "调用方disabled、aria-disabled/loading与边缘合并；playback enabled与isPlaying分离，非loop到头停止。"
dependencies:
  - "React19.2.8与Rain Foundations；rainCn依赖既有tailwind-merge3.6.0。"
  - "embla-carousel-react8.5.2（传递core/reactive-utils同版）及官方embla-carousel-auto-scroll8.5.2；speed按核心60Hz固定步长换算。"
  - "本项实际源码/内部helper/被动视觉依赖在Registry登记；消费仍为managed @rain-next/ui。"
tokens:
  - "布局Space16；导航及紧凑播放36/20，默认播放文字按钮高36px/图标16px；短条4px厚、18/28px长、6px可见间距；覆盖胶囊两端15px。"
  - "Focus宽/offset沿既有Token，灰色轮廓与主题表面halo属于本轮控件局部配方；Arrow和Play/Pause采用现有图标；根内--rain-local-carousel-control-ink/strong/disabled/white/surface登记派生灰度，white历史名为Background/Neutral/1去色主题表面，不改变全局Neutral/Focus。"
layoutConstraints:
  - "Controls inline/overlay显式组合；确认稿独立布局在标题右侧相邻组合导航，四向短条环绕轨道，连续展示导航在页脚；默认不保留外置48px。覆盖空白pointer-events:none，仅实际控件auto；8%轻阴影、纵向下箭头32px/底条28px。媒体安全区与纵向高度由宿主管理。"
  - "纵向需明确轨道高度；logical margin/padding/控制位置，Embla独占transform。"
compositionRules:
  - "调用方事件先执行，preventDefault阻止导航；边缘不能被disabled=false重新启用。"
  - "不无条件inert/aria-hide离屏交互内容，Embla watchFocus把聚焦项带入视野。"
allowedModifications:
  - "使用本条列出的真实Props/ref/className/style；仅source已提供的Parts支持render/localRecipe，不把通用模板当API。"
  - "视觉用既有Rain Token/具名局部方案；已登记源几何/动效差额不升级全局Foundation。"
restrictedModifications:
  - "不得移除原生语义/焦点/生命周期、重复行为引擎或扩大人工/发布接受。"
accessibility:
  - "region与slide具体名称由宿主给；root有明确键盘入口时接管轴向箭头，子输入/OTP/Slider保留自己的键盘。"
  - "边缘控件aria-disabled保焦点并阻挡激活；宿主显式native disabled保留；位置来自真实API，不按帧播报。"
  - "显式暂停/箭头/短条/拖动/键盘焦点持续停止；hover/后台/离屏临时暂停，只恢复仍启用的意图；reduced motion默认不启动自动。"
  - "reduce通过Embla断点duration0；不把物理duration当毫秒。"
examples:
  - "apps/playground/src/docs/components/g6-interaction-pages.tsx"
recipes:
  - "Root/Content/Item用className/style；默认导航的内部IconButton具名recipe只绑定该实例，未暴露Carousel localRecipe属性。"
antiPatterns:
  - "增加第二selectedIndex/transform引擎或不协调的自动播放插件。"
  - "仅装autoplay插件但没有暂停/恢复、聚焦/悬停停止合同。"

  redesignedTraits:
    - "React native image lifecycle; current Rain Token/focus; existing Popover; explicit native composition"
  intentionallyNotInherited:
    - "Vue code/SCSS and old focus prohibition"
    - "Initials, generic icon avatars and account image workflows"
figmaMapping: "not-established; legacy image lineage retained separately"

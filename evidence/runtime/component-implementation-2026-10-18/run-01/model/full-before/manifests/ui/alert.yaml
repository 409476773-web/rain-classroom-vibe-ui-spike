  version: 1
  familyId: "feedback"
  taskIds:
    - "act-feedback"
  searchAliases:
    - "持续提示"
    - "就近问题说明"
    - "页面警告"
  implementationRole: "root"
  controlScope: "页面内持续问题或状态说明"
  stateOwner: "宿主拥有可见性、请求和处理动作；Alert 不建立瞬时队列或自动关闭计时。"
  relationships:
